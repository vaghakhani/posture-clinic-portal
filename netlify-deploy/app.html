<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("postureclinic_theme");if(t==="dark")document.documentElement.dataset.theme="dark";var u=localStorage.getItem("postureclinic_ui_style")||"neumorphism";document.documentElement.dataset.ui=u;var a=localStorage.getItem("postureclinic_accent");if(a){try{var p=JSON.parse(a);if(p&&p.brand){document.documentElement.style.setProperty("--brand",p.brand);document.documentElement.style.setProperty("--brand-dark",p.dark||p.brand);document.documentElement.style.setProperty("--brand-soft",p.soft||"#dbeafe");}}catch(e2){}}}catch(e){document.documentElement.dataset.ui="neumorphism";}})();</script>
<script>if(window.matchMedia("(max-width:768px)").matches||new URLSearchParams(location.search).get("mobilePreview")==="1")document.documentElement.classList.add("is-phone");</script>
<link rel="icon" type="image/png" sizes="32x32" href="Logo.png" />
<link rel="icon" type="image/png" sizes="192x192" href="Logo.png" />
<link rel="icon" type="image/png" sizes="512x512" href="Logo.png" />
<link rel="apple-touch-icon" href="Logo.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1a33" />
<meta name="application-name" content="Posture Clinic" />
<meta name="apple-mobile-web-app-title" content="Posture Clinic" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="msapplication-TileImage" content="Logo.png" />
<meta name="msapplication-TileColor" content="#0b1a33" />
<title>Posture Clinic — Dr. Ardeshir Ekhtiari</title>
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand-dark:#1e40af; --brand-soft:#dbeafe;
    --accent:#0891b2; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
    --text:#0f172a; --soft:#f1f5f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--soft)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .app{display:flex;height:100vh;overflow:hidden}

  /* Scrollbars: hidden until scrolling, then fade away */
  .nav,.content,.chart-pane,.chart-pain-side,.chart-list-box,.time-grid,
  .pain-editor-wrap .painlist,.editor-tabs,.editor-pane,.modal,
  .picker-list,.patient-search-results,.autohide-scroll{
    scrollbar-width:thin;
    scrollbar-color:transparent transparent;
  }
  .nav.show-scrollbar,.content.show-scrollbar,.chart-pane.show-scrollbar,
  .chart-pain-side.show-scrollbar,.chart-list-box.show-scrollbar,.time-grid.show-scrollbar,
  .pain-editor-wrap .painlist.show-scrollbar,.editor-tabs.show-scrollbar,.editor-pane.show-scrollbar,
  .modal.show-scrollbar,.picker-list.show-scrollbar,.patient-search-results.show-scrollbar,
  .autohide-scroll.show-scrollbar{
    scrollbar-color:rgba(100,116,139,.55) transparent;
  }
  .nav::-webkit-scrollbar,.content::-webkit-scrollbar,.chart-pane::-webkit-scrollbar,
  .chart-pain-side::-webkit-scrollbar,.chart-list-box::-webkit-scrollbar,.time-grid::-webkit-scrollbar,
  .pain-editor-wrap .painlist::-webkit-scrollbar,.editor-tabs::-webkit-scrollbar,.editor-pane::-webkit-scrollbar,
  .modal::-webkit-scrollbar,.picker-list::-webkit-scrollbar,.patient-search-results::-webkit-scrollbar,
  .autohide-scroll::-webkit-scrollbar{width:8px;height:8px}
  .nav::-webkit-scrollbar-track,.content::-webkit-scrollbar-track,.chart-pane::-webkit-scrollbar-track,
  .chart-pain-side::-webkit-scrollbar-track,.chart-list-box::-webkit-scrollbar-track,.time-grid::-webkit-scrollbar-track,
  .pain-editor-wrap .painlist::-webkit-scrollbar-track,.editor-tabs::-webkit-scrollbar-track,.editor-pane::-webkit-scrollbar-track,
  .modal::-webkit-scrollbar-track,.picker-list::-webkit-scrollbar-track,.patient-search-results::-webkit-scrollbar-track,
  .autohide-scroll::-webkit-scrollbar-track{background:transparent}
  .nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.chart-pane::-webkit-scrollbar-thumb,
  .chart-pain-side::-webkit-scrollbar-thumb,.chart-list-box::-webkit-scrollbar-thumb,.time-grid::-webkit-scrollbar-thumb,
  .pain-editor-wrap .painlist::-webkit-scrollbar-thumb,.editor-tabs::-webkit-scrollbar-thumb,.editor-pane::-webkit-scrollbar-thumb,
  .modal::-webkit-scrollbar-thumb,.picker-list::-webkit-scrollbar-thumb,.patient-search-results::-webkit-scrollbar-thumb,
  .autohide-scroll::-webkit-scrollbar-thumb{
    background:transparent;border-radius:999px;border:2px solid transparent;background-clip:padding-box;
  }
  .nav.show-scrollbar::-webkit-scrollbar-thumb,.content.show-scrollbar::-webkit-scrollbar-thumb,
  .chart-pane.show-scrollbar::-webkit-scrollbar-thumb,.chart-pain-side.show-scrollbar::-webkit-scrollbar-thumb,
  .chart-list-box.show-scrollbar::-webkit-scrollbar-thumb,.time-grid.show-scrollbar::-webkit-scrollbar-thumb,
  .pain-editor-wrap .painlist.show-scrollbar::-webkit-scrollbar-thumb,.editor-tabs.show-scrollbar::-webkit-scrollbar-thumb,
  .editor-pane.show-scrollbar::-webkit-scrollbar-thumb,.modal.show-scrollbar::-webkit-scrollbar-thumb,
  .picker-list.show-scrollbar::-webkit-scrollbar-thumb,.patient-search-results.show-scrollbar::-webkit-scrollbar-thumb,
  .autohide-scroll.show-scrollbar::-webkit-scrollbar-thumb{
    background:rgba(100,116,139,.55);background-clip:padding-box;
  }
  html[data-theme="dark"] .nav.show-scrollbar,
  html[data-theme="dark"] .content.show-scrollbar,
  html[data-theme="dark"] .chart-pane.show-scrollbar,
  html[data-theme="dark"] .chart-pain-side.show-scrollbar,
  html[data-theme="dark"] .chart-list-box.show-scrollbar,
  html[data-theme="dark"] .time-grid.show-scrollbar,
  html[data-theme="dark"] .pain-editor-wrap .painlist.show-scrollbar,
  html[data-theme="dark"] .editor-tabs.show-scrollbar,
  html[data-theme="dark"] .editor-pane.show-scrollbar,
  html[data-theme="dark"] .modal.show-scrollbar,
  html[data-theme="dark"] .picker-list.show-scrollbar,
  html[data-theme="dark"] .patient-search-results.show-scrollbar,
  html[data-theme="dark"] .autohide-scroll.show-scrollbar{
    scrollbar-color:rgba(148,163,184,.55) transparent;
  }
  html[data-theme="dark"] .nav.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .content.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .chart-pane.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .chart-pain-side.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .chart-list-box.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .time-grid.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .pain-editor-wrap .painlist.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .editor-tabs.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .editor-pane.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .modal.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .picker-list.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .patient-search-results.show-scrollbar::-webkit-scrollbar-thumb,
  html[data-theme="dark"] .autohide-scroll.show-scrollbar::-webkit-scrollbar-thumb{
    background:rgba(148,163,184,.55);background-clip:padding-box;
  }

  /* Sidebar */
  .sidebar{width:230px;background:linear-gradient(180deg,#1e40af,#2563eb);color:#e0edff;display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.15)}
  .brand h1{font-size:18px;margin:0;letter-spacing:.3px}
  .brand p{margin:4px 0 0;font-size:12px;opacity:.85}
  .nav{padding:10px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;color:#e0edff;text-decoration:none;font-size:14px;margin-bottom:4px}
  .nav a:hover{background:rgba(255,255,255,.12)}
  .nav a.active{background:#fff;color:#1e40af;font-weight:600}
  .nav .ic{width:20px;text-align:center}
  .nav-divider{height:1px;background:rgba(255,255,255,.15);margin:10px 12px 8px}
  .nav-section-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65;padding:6px 13px 4px;margin:0}
  .btn.copied{opacity:.95}
  .nav-badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:4px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:1.3;text-align:center}
  .sb-foot{padding:12px;font-size:11px;opacity:.8;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .sb-foot #storageBadge,.sb-cloud-badge{
    width:100%;margin:0;padding:5px 8px;font-size:11px;font-weight:600;line-height:1.2;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#e0edff;cursor:pointer;text-align:center
  }
  .sb-foot #storageBadge:hover{filter:brightness(1.05)}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;flex-shrink:0}
  .topbar h2{margin:0;font-size:18px}
  .topbar-tools{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .topbar-form-links{display:flex;align-items:center;gap:8px;flex-shrink:1;min-width:0}
  .topbar-form-copy{white-space:nowrap;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--brand-dark);cursor:pointer;font-family:inherit;line-height:1.2}
  .topbar-form-copy:hover{background:var(--brand-soft);border-color:#93c5fd}
  .topbar-form-copy.copied{background:#dcfce7;border-color:#86efac;color:#15803d}
  .mobile-menu-btn,.mobile-search-btn{display:none}
  .topbar .search{margin-left:0;position:relative;flex-shrink:0}
  .topbar .search input{width:260px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:20px;background:var(--soft)}
  .topbar .search::before{content:"\1F50D";position:absolute;left:11px;top:8px;font-size:13px;opacity:.6}
  .content{flex:1;overflow:auto;padding:22px}
  .content.apps-fill{overflow:hidden;display:flex;flex-direction:column;padding-bottom:22px}
  .apps-page{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
  .apps-page .forms-send-panel{flex-shrink:0;margin-bottom:0}
  .apps-list-panel{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0!important}

  /* Cards / grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:22px}
  .cards.dashboard-counts{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .cards.dashboard-money{grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:18px}
  .cards.dashboard-counts .stat,.cards.dashboard-money .stat{padding:14px 12px}
  .cards.dashboard-counts .stat .n{font-size:24px}
  .cards.dashboard-money .stat .n{font-size:18px}
  .cards.dashboard-counts .stat .l,.cards.dashboard-money .stat .l{font-size:11px}
  @media (max-width:1100px){
    .cards.dashboard-counts{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cards.dashboard-money{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat .n{font-size:30px;font-weight:700;color:var(--brand-dark)}
  .stat .l{color:var(--muted);font-size:13px;margin-top:2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  .panel h3{margin:0 0 14px;font-size:16px}
  .panel .desc{color:var(--muted);font-size:13px;margin:-8px 0 16px}
  .dash-finance-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f8fbff 0%,#eef6ff 100%)}
  .dash-finance-banner h3{margin:0 0 4px;font-size:16px;color:var(--brand-dark)}
  .dash-finance-banner p{margin:0;color:var(--muted);font-size:13px}
  .cards.finance-summary{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .cards.finance-methods{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
  .cards.finance-summary .stat,.cards.finance-methods .stat{padding:16px 14px}
  .cards.finance-summary .stat .n,.cards.finance-methods .stat .n{font-size:22px}
  .cards.finance-summary .stat .l,.cards.finance-methods .stat .l{font-size:12px}
  .stat.stat-accent{background:linear-gradient(180deg,#eff6ff 0%,#dbeafe 100%);border-color:#93c5fd}
  .panel-head-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:14px}
  .panel-head-actions h3{margin:0}
  @media (max-width:1100px){
    .cards.finance-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cards.finance-methods{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  .dash-recent-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .dash-recent-row:last-child{border-bottom:0}
  .dash-recent-row .nm{flex:1;min-width:0;font-weight:600}
  .dash-recent-row .meta{color:var(--muted);font-weight:500}

  /* Buttons */
  .btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:9px;font-size:14px;color:var(--text)}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* Forms */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .grid.four{grid-template-columns:repeat(4,1fr)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .date-combo{display:flex;gap:6px}
  .date-combo input{flex:1}
  .date-combo button{width:34px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brand-dark);font-weight:700}
  .date-combo button:hover{background:var(--brand-soft)}
  .sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-dark);margin:22px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--brand-soft)}
  .sec-title:first-child{margin-top:0}

  /* Table */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  tbody tr:hover{background:var(--soft)}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .tag.green{background:#dcfce7;color:#15803d}
  .tag.blue{background:#dbeafe;color:#1d4ed8}
  .tag.amber{background:#fef3c7;color:#92400e}
  .tag.orange{background:#ffedd5;color:#c2410c}
  .tag.circle{min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .patients-table th,.patients-table td{padding:8px 10px;vertical-align:middle}
  .patients-table .name-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .patients-table .row-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
  .patients-table .row-actions .btn.sm{padding:5px 10px;white-space:nowrap}
  .btn-icon-danger{width:32px;height:32px;padding:0;border-radius:999px;border:0;background:#ef4444;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;line-height:1;font-size:14px}
  .btn-icon-danger:hover{background:#dc2626}
  .linkbtn{border:0;background:none;padding:0;color:var(--brand-dark);font-weight:700;text-align:left;cursor:pointer}
  .linkbtn:hover{text-decoration:underline}
  .email-value{word-break:break-all;color:var(--brand-dark);text-decoration:none}
  .email-value:hover{text-decoration:underline}
  .profile-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 18px}
  .profile-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .profile-card .v{font-size:20px;font-weight:800;color:var(--brand);line-height:1.15}
  .profile-card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;font-weight:600}
  .profile-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}
  .profile-info-grid .hint{text-transform:uppercase;letter-spacing:.35px;font-size:11px;margin-bottom:2px}
  .profile-edit-input,.profile-intake-fields .profile-edit-input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:var(--text)
  }
  .profile-edit-row{display:flex;gap:8px}
  .profile-intake-fields .profile-edit-block{margin:0 0 14px}
  .profile-intake-fields .profile-edit-block b{display:block;margin-bottom:6px}
  .profile-intake-fields textarea.profile-edit-input{min-height:72px;resize:vertical}
  .profile-section-title{margin:0 0 12px;font-size:16px;font-weight:800;color:var(--brand)}
  .profile-intake-fields p{margin:0 0 12px;line-height:1.45}
  .profile-intake-fields b{font-weight:700}
  .profile-consent-box{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:14px;padding:16px 18px}
  .profile-consent-box .consent-head{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin:0 0 10px}
  .profile-consent-box p{margin:0 0 10px;line-height:1.5;color:#334155}
  .profile-consent-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .profile-consent-meta .hint{margin-bottom:2px}
  .profile-head-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .profile-head-name h3{margin:0}
  .profile-pain-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(180px,.8fr);gap:18px;align-items:start}
  .profile-pain-list{margin:0;padding-left:18px}
  .profile-pain-list li{margin:0 0 8px}
  .profile-soap-table{width:100%;border-collapse:collapse}
  .profile-soap-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);padding:0 8px 10px;border-bottom:1px solid var(--line)}
  .profile-soap-table td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .profile-soap-table tr:last-child td{border-bottom:0}
  .profile-soap-table .open-cell{text-align:right;width:1%}
  @media (max-width:820px){
    .profile-info-grid,.profile-pain-layout,.profile-consent-meta{grid-template-columns:1fr}
    .chart-layout{grid-template-columns:1fr !important}
    .chart-nav{flex-direction:row;flex-wrap:wrap}
  }
  .cal-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .cal-title{font-size:18px;font-weight:800;color:var(--brand-dark);margin-right:auto}
  .calendar-grid{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .time-grid{display:grid;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:620px;background:#fff}
  .time-head{position:sticky;top:0;z-index:2;background:#eff6ff;color:var(--brand-dark);font-weight:800;text-align:center;padding:9px;border-right:1px solid #bfdbfe;border-bottom:1px solid #bfdbfe}
  .time-label{background:#f8fafc;color:#64748b;font-size:12px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
  .time-cell{min-height:42px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:#fff}
  .cal-cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:#fff}
  .cal-cell:nth-child(7n){border-right:0}
  .cal-day-head{background:#eff6ff;color:var(--brand-dark);font-weight:800;text-align:center;padding:9px;border-right:1px solid #bfdbfe}
  .cal-day-head:nth-child(7n){border-right:0}
  .cal-date{font-size:12px;font-weight:800;color:#334155;margin-bottom:6px}

function readLegacyLocalDb(){
  try{
    const raw = localStorage.getItem(DB_KEY) || localStorage.getItem(LEGACY_DB_KEY);
    if(!raw) return null;
    const db = JSON.parse(raw);
    if(!db || typeof db !== "object") return null;
    const hasRows = ["patients","visits","invoices","appointments","histories","exams"].some(k=>Array.isArray(db[k]) && db[k].length);
    return hasRows ? db : null;
  }catch(e){ return null; }

function clearLegacyLocalDb(){
  try{
    localStorage.removeItem(DB_KEY);

function forgottenIdSet(){
  const s = new Set();
  (DB.deletedPatientIds || []).forEach(id => { if(id) s.add(String(id)); });
  (DB.deletedSubmissionIds || []).forEach(id => { if(id) s.add(String(id)); });
  return s;
}
function isForgottenPatient(p){
  if(!p) return false;
  const skip = forgottenIdSet();
  if(p.id && skip.has(String(p.id))) return true;
  if(p.sourceSubmissionId && skip.has(String(p.sourceSubmissionId))) return true;
  return false;
}
function isForgottenSubmission(row, d){
  const skip = forgottenIdSet();
  if(row && row.id && skip.has(String(row.id))) return true;
  if(d && d.id && skip.has(String(d.id))) return true;
  return false;
}
function applyCloudDb(cloud){
  if(!cloud || typeof cloud !== "object") return;
  DB = cloud;
  ensureDbShape();
  DB.patients = (DB.patients || []).filter(p => !isForgottenPatient(p));
}
let DB = emptyClinicDb();

/* ---- Portable file storage (data lives in a file that travels with the app) ---- */
let fileHandle = null;          // linked PostureClinicData.json handle
let needsReconnect = false;     // handle exists but permission must be re-granted (needs a click)
let _writeTimer = null, _dirty = false;

function save(){
  if(window.PostureClinicSync && PostureClinicSync.isOnline && PostureClinicSync.isOnline()){
    PostureClinicSync.scheduleSave(DB);
  }
}
function scheduleFileWrite(){
  if(!fileHandle) return;
  _dirty = true; clearTimeout(_writeTimer);
  _writeTimer = setTimeout(writeFile, 500);
}
async function writeFile(){
  if(!fileHandle || !_dirty) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(DB, null, 2));
    await w.close();
    _dirty = false; updateStorageBadge();
  }catch(e){ console.warn("File write failed", e); }
}

/* IndexedDB: remember the linked file handle between sessions */
function idbOpen(name="postureclinic_fs"){ return new Promise((res,rej)=>{ const r=indexedDB.open(name,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("h","readwrite");
  t.objectStore("h").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("h","readonly");
  const rq=t.objectStore("h").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res)=>{ const t=db.transaction("h","readwrite");
  t.objectStore("h").delete(k); t.oncomplete=()=>res(); }); }

async function permGranted(h,write){ const o={mode:write?"readwrite":"read"};
  try{ return (await h.queryPermission(o))==="granted"; }catch(e){ return false; } }
async function permRequest(h,write){ const o={mode:write?"readwrite":"read"};
  try{ if((await h.queryPermission(o))==="granted") return true; return (await h.requestPermission(o))==="granted"; }catch(e){ return false; } }

const fsSupported = () => !!(window.showSaveFilePicker && window.showOpenFilePicker);

/* Create/choose the portable data file and start saving to it */
async function connectDataFile(){
  if(!fsSupported()){ toast("This browser can't link a data file. Use Export/Import backups instead."); return; }
  try{
    const h = await window.showSaveFilePicker({ suggestedName:"PostureClinicData.json",
      types:[{description:"Posture Clinic Data",accept:{"application/json":[".json"]}}] });
    fileHandle = h; needsReconnect=false; await idbSet("dataFile",h);
    _dirty = true; await writeFile();
    toast("Data file linked — everything now saves into this file.");
    updateStorageBadge(); if(current==="settings") views.settings();
  }catch(e){ if(e.name!=="AbortError") toast("Could not link data file"); }
}
/* Open an existing data file (e.g. after moving the folder to a new PC) */
async function openDataFile(){
  if(!fsSupported()){ toast("This browser can't open a data file. Use Import backup instead."); return; }
  try{
    const [h] = await window.showOpenFilePicker({ types:[{description:"Posture Clinic Data",accept:{"application/json":[".json"]}}] });
    if(!(await permRequest(h,true))) return;
    const txt = await (await h.getFile()).text();
    DB = JSON.parse(txt); fileHandle=h; needsReconnect=false; await idbSet("dataFile",h);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    toast("Loaded data from file."); go("dashboard");
  }catch(e){ if(e.name!=="AbortError") toast("Could not open data file"); }
}
async function disconnectDataFile(){ fileHandle=null; needsReconnect=false; await idbDel("dataFile"); updateStorageBadge(); if(current==="settings") views.settings(); toast("Unlinked data file (still saved locally)."); }

/* Re-grant permission after a restart (browsers require a click) */
async function reconnectDataFile(){
  const h = await idbGet("dataFile"); if(!h){ connectDataFile(); return; }
  if(await permRequest(h,true)){
    fileHandle=h; needsReconnect=false;
    try{ const txt=await (await h.getFile()).text(); if(txt.trim()){ DB=JSON.parse(txt); localStorage.setItem(DB_KEY,JSON.stringify(DB)); } }catch(e){}
    updateStorageBadge(); toast("Reconnected to data file."); go(current);
  }
}
function storageBadgeClick(){ settingsTab = "backup"; go("settings"); }
function updateStorageBadge(){
  const b = document.getElementById("storageBadge"); if(!b) return;
  if(window.PostureClinicSync && PostureClinicSync.isOnline && PostureClinicSync.isOnline()){
    const st = PostureClinicSync.getStatus ? PostureClinicSync.getStatus() : { status:"idle", error:"" };
    if(st.status==="loading"){ b.textContent="Loading cloud…"; b.style.background="#dbeafe"; b.style.borderColor="#93c5fd"; b.title="Loading clinic data from Supabase"; return; }
    if(st.status==="syncing"){ b.textContent="Saving…"; b.style.background="#fef3c7"; b.style.borderColor="#fcd34d"; b.title="Saving to Supabase"; return; }
    if(st.status==="error"){ b.textContent="Sync error"; b.style.background="#fee2e2"; b.style.borderColor="#fecaca"; b.title=st.error||"Cloud sync error"; return; }
    b.textContent="Supabase"; b.style.background="#dcfce7"; b.style.borderColor="#86efac"; b.title="Clinic data is stored in Supabase"; return;
  }
  b.textContent="Not connected"; b.style.background="#fee2e2"; b.style.borderColor="#fecaca"; b.title="Supabase is not configured";
}

async function initStorage(){
  ensureDbShape();
  if(!(window.PostureClinicSync && PostureClinicSync.isOnline && PostureClinicSync.isOnline())){
    toast("This portal must be connected to Supabase. Check api-config.js.");
    updateStorageBadge();
    go("dashboard");
    return;
  }
  if(PostureClinicSync.onStatusChange) PostureClinicSync.onStatusChange(()=>updateStorageBadge());
  if(typeof PostureClinicSync.onRemoteDb === "function"){
    PostureClinicSync.onRemoteDb(function(next){ applyCloudDb(next); });
  }
  try{
    const cloud = await PostureClinicSync.loadSnapshot();
    const leftover = readLegacyLocalDb();
    if(cloud && leftover && typeof PostureClinicSync.mergeClinicDatabases === "function"){
      applyCloudDb(PostureClinicSync.mergeClinicDatabases(leftover, cloud));
      await PostureClinicSync.saveSnapshot(DB, true);
    } else if(cloud){
      applyCloudDb(cloud);
    } else if(leftover){
      applyCloudDb(leftover);
      await PostureClinicSync.saveSnapshot(DB, true);
    } else {
      applyCloudDb(emptyClinicDb());
      await PostureClinicSync.saveSnapshot(DB, true);
    }
    clearLegacyLocalDb();
  }catch(e){
    console.warn("Cloud load failed", e);
    toast(e.message || "Could not load clinic data from Supabase");
  }
  try{ await importNewIntakeSubmissions({ quiet:true }); }catch(e){ console.warn("Intake import failed", e); }
  const last = localStorage.getItem(LAST_VIEW_KEY) || localStorage.getItem(LEGACY_LAST_VIEW_KEY);
  go(views[last]?last:"dashboard"); updateStorageBadge();
  startLiveIntakeWatch();
  startAutoBackups();
}

function buildPatientFormEmail(type){
  const url = patientIntakeUrl(type);

  const subject = isOsteo
    ? "Complete Your Registration Form — Posture Clinic"

  const bodyLines = isOsteo
    ? [

        "",
        "Thank you for choosing Posture Clinic. We look forward to welcoming you to our clinic.",

        "To help us prepare for your visit, please complete our secure online registration form at your earliest convenience:",

async function sendPatientFormEmail(type, inputId, btn){
  const input = document.getElementById(inputId);
  const to = String(input && input.value || "").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){
    portalMessage("Enter a valid patient email address.", {type:"warning", duration:4000});
    if(input) input.focus();
    return;
  }
  const cfg = window.POSTURE_PORTAL_API || {};
  const endpoint = String(cfg.gmailAppsScriptUrl || "").trim();
  const secret = String(cfg.gmailAppsScriptSecret || "").trim();
  if(!endpoint || !secret){
    portalMessage("Email sending is not configured yet.", {type:"error"});
    return;
  }
  const mail = buildPatientFormEmail(type);
  const prev = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Sending…"; }
  try{
    showPortalLoading("Sending form email…");
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret,
        origin: location.origin,
        to,
        subject: mail.subject,
        body: mail.body,
        htmlBody: mail.htmlBody,
        fromName: "Posture Clinic",
        replyTo: "ardeshir@drekhtiari.com"
      })
    });
    let data = null;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(!res.ok || (data && data.ok === false)){
      throw new Error((data && data.error) || ("Email failed (" + res.status + ")"));
    }
    portalMessage("Form email sent to " + to + ".", {type:"success"});
    if(input) input.value = "";
  }catch(err){
    console.error("Form email failed", err);
    portalMessage(err.message || "Could not send email.", {type:"error", duration:5000});
  }finally{
    hidePortalLoading();
    if(btn){ btn.disabled = false; btn.textContent = prev || "Send"; }
  }
}

function normalizeIntakeData(row){
  if(!row) return {};
  let d = row.data;
  if(typeof d === "string"){
    try{ d = JSON.parse(d); }catch(e){ d = {}; }
  }
  if(!d || typeof d !== "object") d = {};
  if(!d.first) d.first = d.firstName || d.first_name || "";
  if(!d.last) d.last = d.lastName || d.last_name || "";
  return d;
}
function findPatientForSubmission(row){
  const d = normalizeIntakeData(row);
  const email = String(d.email || "").trim().toLowerCase();
  const name = ((d.first || "") + " " + (d.last || "")).trim().toLowerCase();
  const phone = String(d.phone || "").replace(/\D/g, "");
  return DB.patients.find(p=>{
    if(row && row.id && (p.sourceSubmissionId === row.id || p.id === row.id)) return true;
    if(d.id && p.id === d.id) return true;
    const pname = fullName(p).toLowerCase();
    if(name && pname && name === pname) return true;
    const pEmail = String(p.email || "").trim().toLowerCase();
    if(email && pEmail && email === pEmail && (!name || !pname || name === pname)) return true;
    const pPhone = String(p.phone || "").replace(/\D/g, "");
    if(phone && pPhone && phone === pPhone && name && pname === name) return true;
    return false;
  }) || null;
}
function formatSubmissionWhen(value){
  if(!value) return "—";
  const dt = new Date(value);
  if(Number.isNaN(dt.getTime())) return String(value);
  return dt.toLocaleString();
}
async function openSubmission(id){
  const row = (_recentApps || []).find(r=>r.id===id) || (_pendingApps || []).find(r=>r.id===id);
  if(!row){ toast("Submission not found"); return; }
  let patient = findPatientForSubmission(row);
  if(!patient){
    await ingestIntakeRow(row);
    save();
    patient = findPatientForSubmission(row);
  }
  if(patient) viewPatient(patient.id);
  else toast("No matching patient found yet.");
}

let portalMessageTimer = null;
function portalMessage(msg, opts){
  opts = opts || {};
  const el = $("#portalMessage");
  if(!el) return;
  const type = opts.type || "info";
  el.className = "portal-message show " + type;
  el.textContent = typeof msg === "string" ? msg : (msg && msg.message) || String(msg || "");
  clearTimeout(portalMessageTimer);
  const duration = opts.duration != null ? opts.duration : 3200;
  if(duration > 0){
    portalMessageTimer = setTimeout(()=> el.classList.remove("show"), duration);
  }
}
function clearPortalMessage(){
  clearTimeout(portalMessageTimer);
  $("#portalMessage")?.classList.remove("show");
}
let _portalDialogResolver = null;
function closePortalDialog(result){
  const bg = $("#portalDialogBg");
  if(bg){ bg.classList.remove("open"); bg.hidden = true; }
  const inp = $("#portalDialogInput");
  if(inp){ inp.hidden = true; inp.value = ""; }
  const resolve = _portalDialogResolver;
  _portalDialogResolver = null;
  if(resolve) resolve(result);
}
function openPortalDialog(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    if(_portalDialogResolver) closePortalDialog(opts.mode === "prompt" ? null : false);
    _portalDialogResolver = resolve;
    const bg = $("#portalDialogBg");
    const title = $("#portalDialogTitle");
    const msg = $("#portalDialogMsg");
    const inp = $("#portalDialogInput");
    const ok = $("#portalDialogOk");
    const cancel = $("#portalDialogCancel");
    if(title) title.textContent = opts.title || (opts.mode === "prompt" ? "Enter a value" : "Please confirm");
    if(msg) msg.textContent = opts.message || "";
    if(ok) ok.textContent = opts.okLabel || "OK";
    if(cancel){
      cancel.textContent = opts.cancelLabel || "Cancel";
      cancel.style.display = opts.hideCancel ? "none" : "";
    }
    if(inp){
      const isPrompt = opts.mode === "prompt";
      inp.hidden = !isPrompt;
      inp.value = isPrompt ? (opts.value || "") : "";
      if(isPrompt) setTimeout(function(){ inp.focus(); inp.select(); }, 30);
    }
    if(bg){ bg.hidden = false; bg.classList.add("open"); }
  });
}
function portalConfirm(message, title){
  return openPortalDialog({ mode:"confirm", message: String(message||""), title: title || "Please confirm" });
}
function portalPrompt(message, value, title){
  return openPortalDialog({ mode:"prompt", message: String(message||""), value: value || "", title: title || "Enter a value" });
}
function portalAlert(message, title){
  return openPortalDialog({ mode:"alert", message: String(message||""), title: title || "Notice", hideCancel:true, okLabel:"OK" }).then(function(){ return true; });
}
(function bindPortalDialog(){
  const bg = document.getElementById("portalDialogBg");
  const ok = document.getElementById("portalDialogOk");
  const cancel = document.getElementById("portalDialogCancel");
  const inp = document.getElementById("portalDialogInput");
  if(ok) ok.addEventListener("click", function(){
    const inputEl = document.getElementById("portalDialogInput");
    const isPrompt = inputEl && !inputEl.hidden;
    closePortalDialog(isPrompt ? inputEl.value : true);
  });
  if(cancel) cancel.addEventListener("click", function(){
    const inputEl = document.getElementById("portalDialogInput");
    const isPrompt = inputEl && !inputEl.hidden;
    closePortalDialog(isPrompt ? null : false);
  });
  if(bg) bg.addEventListener("click", function(e){
    if(e.target !== bg) return;
    const inputEl = document.getElementById("portalDialogInput");
    const isPrompt = inputEl && !inputEl.hidden;
    closePortalDialog(isPrompt ? null : false);
  });
  if(inp) inp.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); closePortalDialog(inp.value); }
    if(e.key === "Escape"){ e.preventDefault(); closePortalDialog(null); }
  });
  window.alert = function(msg){ portalAlert(String(msg||"")); };
})();
let _portalLoadingDepth = 0;
function showPortalLoading(msg){
  const el = $("#portalLoading");
  const txt = $("#portalLoadingText");
  if(txt) txt.textContent = msg || "Please wait…";
  if(el){
    el.hidden = false;
    el.classList.add("open");
  }
  _portalLoadingDepth++;
  document.body.classList.add("portal-busy");
}
function hidePortalLoading(){
  _portalLoadingDepth = Math.max(0, _portalLoadingDepth - 1);
  if(_portalLoadingDepth > 0) return;
  const el = $("#portalLoading");
  if(el){
    el.classList.remove("open");
    el.hidden = true;
  }
  document.body.classList.remove("portal-busy");
}
/** Show a blocking loading overlay while async work runs. Fast ops can pass {delay:150} to avoid a flash. */
function runWithLoading(msg, work, opts){
  opts = opts || {};
  const delay = opts.delay != null ? opts.delay : 0;
  const minMs = opts.minMs != null ? opts.minMs : 400;
  let shown = false;
  let showTimer = null;
  const start = Date.now();
  if(delay <= 0){
    showPortalLoading(msg);
    shown = true;
  } else {
    showTimer = setTimeout(function(){ showPortalLoading(msg); shown = true; }, delay);
  }
  return Promise.resolve()
    .then(function(){ return typeof work === "function" ? work() : work; })
    .finally(function(){
      clearTimeout(showTimer);
      const finish = function(){ if(shown) hidePortalLoading(); };
      if(!shown) return;
      const wait = Math.max(0, minMs - (Date.now() - start));
      if(wait) return new Promise(function(resolve){ setTimeout(function(){ finish(); resolve(); }, wait); });
      finish();
    });
}

function patientIntakeUrl(type){
  if(typeof window.portalPatientIntakeUrl === "function") return window.portalPatientIntakeUrl(type);
  const dir = location.pathname.replace(/[^/]+$/, "");
  const base = (typeof window.getPortalPublicBase === "function"
    ? window.getPortalPublicBase()
    : location.origin + dir.replace(/\/$/, "")) + "/patient-intake.html";
  if(type === "osteopathy" || type === "non-chiropractic" || type === "registration") return base + "?form=osteopathy";
  return base;
}
function showCopyFeedback(el){
  if(!el) return;
  clearTimeout(el._copyResetTimer);
  if(el.tagName === "BUTTON"){
    if(el.dataset.defaultText == null) el.dataset.defaultText = el.textContent;
    el.textContent = "Copied";
    el.classList.add("copied");
    el._copyResetTimer = setTimeout(()=>{
      el.textContent = el.dataset.defaultText;
      el.classList.remove("copied");
    }, 2000);
  }
}
function copyPatientIntakeLink(type, el){
  const url = patientIntakeUrl(type);
  const label = (type === "osteopathy" || type === "non-chiropractic")
    ? "Osteopathy Form link copied"
    : "Chiropractor Form link copied";
  const onCopied = ()=>{
    showCopyFeedback(el);
    if(!el || (!el.classList.contains("nav-link-copy") && !el.classList.contains("topbar-form-copy"))) toast(label);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(onCopied).catch(()=>fallbackCopy(url, label, el));
  } else fallbackCopy(url, label, el);
}
function fallbackCopy(text, msg, el){
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand("copy");
    showCopyFeedback(el);
    if(!el || (!el.classList.contains("nav-link-copy") && !el.classList.contains("topbar-form-copy"))) toast(msg || "Link copied.");
  }catch(e){ toast(text); }
  document.body.removeChild(ta);
}
function dashboardStats(){
  let totalBilled=0, collected=0, outstanding=0, unpaidInvoices=0;
  const byMethod={"Credit Card":0,"Debit Card":0,eTransfer:0,Cash:0,Other:0};
  DB.invoices.forEach(inv=>{
    const t=invTotals(inv);
    totalBilled+=t.total; collected+=t.paid; outstanding+=t.balance;
    if(t.balance>0) unpaidInvoices++;
    (inv.payments||[]).forEach(p=>{
      const m=p.method||"Other";
      if(byMethod[m]==null) byMethod.Other+=Number(p.amount)||0;
      else byMethod[m]+=Number(p.amount)||0;
    });
  });
  return {totalBilled,collected,outstanding,unpaidInvoices,byMethod};
}

let modalStack = [];
function openModal(html, wide, replace){
  const m=$("#modal"), bg=$("#modalBg");
  if(bg.classList.contains("open") && !replace) modalStack.push({html:m.innerHTML,className:m.className});
  m.className="modal"+(wide?" wide":""); m.innerHTML=html; bg.classList.add("open"); document.body.classList.add("modal-open");
  updateModalBack();
}
function updateModalBack(){
  const h=$("#modal .modal-head"); if(!h) return;
  h.querySelector(".modal-back")?.remove();
  if(modalStack.length) h.insertAdjacentHTML("afterbegin",`<button class="modal-back" onclick="modalBack()">&larr; Back</button>`);
}
function modalBack(){
  const prev = modalStack.pop(); if(!prev){ closeModal(); return; }
  const m=$("#modal"); m.className=prev.className; m.innerHTML=prev.html; updateModalBack();
}
function closeModal(){ $("#modalBg").classList.remove("open"); document.body.classList.remove("modal-open"); modalStack=[]; chartEditing=false; editingPaymentId=null; }

async function ingestIntakeRow(row){
  if(!row) return { patient:null, created:false };
  const d = normalizeIntakeData(row);
  row.data = d;
  if(isForgottenSubmission(row, d)) return { patient:null, created:false };
  if(!d.first && !d.last && !d.phone && !d.email) return { patient:null, created:false };
  const st = String(row.status || "").toLowerCase();
  if(st === "rejected" || st === "dismissed") return { patient:null, created:false };
  if(row.id && _ingestingSubmissions.has(row.id)) return { patient: findPatientForSubmission(row), created:false };
  if(row.id) _ingestingSubmissions.add(row.id);
  try{
    let created = false;
    let patient = findPatientForSubmission(row);
    if(!patient){
      patient = Object.assign({}, d, {
        id: d.id || uid(),
        created: todayISO(),
        profileType: d.profileType || "chiropractic",
        pain: d.pain || {},
        sourceSubmissionId: row.id || ""
      });
      DB.patients.push(patient);
      created = true;
    } else if(!patient.sourceSubmissionId && row.id){
      patient.sourceSubmissionId = row.id;
    }
    if(st !== "approved" && window.PostureClinicSync && PostureClinicSync.updateIntakeSubmission){
      try{
        await PostureClinicSync.updateIntakeSubmission(row.id, { status: "approved", reviewed_at: new Date().toISOString() });
        row.status = "approved";
      }catch(e){ console.warn("Could not mark intake approved", e); }
    }
    return { patient, created };
  } finally {
    if(row.id) _ingestingSubmissions.delete(row.id);
  }
}
async function mergeCloudPatients(opts){
  opts = opts || {};
  if(!window.PostureClinicSync || typeof PostureClinicSync.fetchSnapshot !== "function") return 0;
  let cloud = null;
  try{ cloud = await PostureClinicSync.fetchSnapshot(); }
  catch(e){ console.warn("Cloud patient merge failed", e); return 0; }
  if(!cloud || !Array.isArray(cloud.patients) || !cloud.patients.length) return 0;
  const mergeFn = PostureClinicSync.mergePatientLists || function(local, extra){ return (local||[]).concat(extra||[]); };
  const merged = mergeFn(DB.patients, cloud.patients);
  const added = merged.length - DB.patients.length;
  if(added > 0){
    DB.patients = merged;
    refreshLivePatientViews();
    if(!opts.quiet){
      toast(added === 1 ? "New patient form received." : added + " new patient forms received.");
    }
  }
  return added;
}
async function importNewIntakeSubmissions(opts){
  opts = opts || {};
  if(!window.PostureClinicSync || !PostureClinicSync.listIntakeSubmissions) return 0;
  await mergeCloudPatients({ quiet:true });
  let rows = [];
  try{
    rows = await PostureClinicSync.listIntakeSubmissions();
  }catch(e){
    console.warn("Intake import failed", e);
    if(!opts.quiet) toast(e.message || "Could not load submitted forms");
    return 0;
  }
  _recentApps = rows;
  _pendingApps = rows.filter(r=>String(r.status||"").toLowerCase()==="pending");
  let added = 0;
  for(const row of rows){
    const st = String(row.status||"").toLowerCase();
    if(st === "rejected" || st === "dismissed") continue;
    const result = await ingestIntakeRow(row);
    if(result.created) added++;
  }
  if(added){
    save();
    if(window.PostureClinicSync && typeof PostureClinicSync.flushSave === "function"){
      try{ await PostureClinicSync.flushSave(); }catch(e){ console.warn("Cloud save after intake import failed", e); }
    }
  }
  if(added || opts.refresh) refreshLivePatientViews();
  else refreshApplicationsBadge();
  if(added && !opts.quiet){
    toast(added === 1 ? "New patient form received." : added + " new patient forms received.");
  }
  return added;
}
async function handleLiveIntakeRow(row){
  const result = await ingestIntakeRow(row);
  if(result.created){
    save();
    const label = patientProfileLabel(result.patient);
    toast("New " + label + " form: " + (fullName(result.patient) || "patient"));
  } else if(result.patient){
    save();
  }
  refreshLivePatientViews();
}
function startLiveIntakeWatch(){
  if(!window.PostureClinicSync || !PostureClinicSync.isOnline || !PostureClinicSync.isOnline()) return;
  if(window._intakeWatchStarted) return;
  window._intakeWatchStarted = true;
  if(typeof PostureClinicSync.onIntakeSubmission === "function"){
    PostureClinicSync.onIntakeSubmission(function(row){
      handleLiveIntakeRow(row).catch(e=>console.warn("Live intake ingest failed", e));
    });
  }
  if(typeof PostureClinicSync.onSnapshotChange === "function"){
    PostureClinicSync.onSnapshotChange(function(data){
      if(data && typeof data === "object"){
        applyCloudDb(typeof PostureClinicSync.mergeClinicDatabases === "function"
          ? PostureClinicSync.mergeClinicDatabases(data, DB)
          : data);
        importNewIntakeSubmissions({ quiet:true, refresh:true }).catch(function(){});
      } else {
        mergeCloudPatients({ quiet:true }).catch(function(){});
      }
    });
  }
  if(typeof PostureClinicSync.subscribeIntakeSubmissions === "function"){
    PostureClinicSync.subscribeIntakeSubmissions().catch(e=>console.warn("Intake realtime unavailable", e));
  }
  setInterval(function(){
    if(document.hidden) return;
    importNewIntakeSubmissions({ quiet:true }).catch(function(){});
  }, 12000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) importNewIntakeSubmissions({ quiet:true, refresh:true }).catch(function(){});
  });
}
async function approveIntakeSubmission(id){
  const row = (_pendingApps || []).find(r=>r.id===id) || (_recentApps || []).find(r=>r.id===id);
  if(!row || !row.data) return;
  const result = await ingestIntakeRow(row);
  save();
  toast(result.created ? "Application approved — patient added." : "Application already linked to a patient.");
  refreshLivePatientViews();
}
async function rejectIntakeSubmission(id){
  if(!await portalConfirm("Reject this application?")) return;
  await PostureClinicSync.updateIntakeSubmission(id, { status: "rejected", reviewed_at: new Date().toISOString() });
  toast("Application rejected."); views.applications();
}
let _appsPage = 0;
let _appsSearch = "";
let _appsLoadError = "";
function appsPageSize(){
  const box = document.getElementById("appsSubmissionsBox");
  if(!box) return 6;
  const pagerH = 56;
  const headH = 40;
  const avail = Math.max(180, (box.clientHeight || 430) - pagerH - headH);
  return Math.max(5, Math.min(14, Math.floor(avail / 48)));
}
function filteredAppSubmissions(){
  const q = (_appsSearch || "").toLowerCase().trim();
  return (_recentApps || []).filter(row=>{
    if(!q) return true;
    const d = normalizeIntakeData(row);
    const name = ((d.first||"")+" "+(d.last||"")).trim();
    const profile = submissionProfileLabel(d);
    const status = String(row.status || "pending");
    const when = formatSubmissionWhen(row.submitted_at || row.created_at);
    return matchesText(q, name, profile, status, when, d.phone||"", d.email||"");
  });
}
function appsSearchSubmissions(value){
  _appsSearch = value || "";
  _appsPage = 0;
  renderAppsSubmissionsList();
}
function appsSetPage(page){
  const size = appsPageSize();
  const total = Math.max(1, Math.ceil(filteredAppSubmissions().length / size) || 1);
  _appsPage = Math.max(0, Math.min(Number(page)||0, total-1));
  renderAppsSubmissionsList();
}
function renderAppsSubmissionsList(){
  const box = document.getElementById("appsSubmissionsBox");
  if(!box) return;
  const countEl = document.getElementById("appsSubmissionCount");
  const filtered = filteredAppSubmissions();
  const totalAll = (_recentApps || []).length;
  if(countEl){
    countEl.textContent = _appsSearch.trim() && filtered.length !== totalAll
      ? `${filtered.length} of ${totalAll}`
      : String(totalAll);
  }
  if(_appsLoadError){
    box.innerHTML = `<div class="apps-submissions-scroll"><div class="empty">${esc(_appsLoadError)}</div></div>`;
    return;
  }
  if(!totalAll){
    box.innerHTML = `<div class="apps-submissions-scroll"><div class="empty">No online submissions are visible. If a patient already sent a form, run the intake SQL in Supabase so staff can read <code>intake_submissions</code>.</div></div>`;
    return;
  }
  const size = appsPageSize();
  const totalPages = Math.max(1, Math.ceil(filtered.length / size) || 1);
  if(_appsPage > totalPages-1) _appsPage = totalPages-1;
  const start = _appsPage * size;
  const pageRows = filtered.slice(start, start + size);
  let body;
  if(!filtered.length){
    body = `<div class="empty">No matching submissions.</div>`;
  } else {
    body = `<table class="apps-submissions-table" style="--apps-rows:${Math.max(pageRows.length,1)}"><thead><tr>
        <th>Submitted</th><th>Patient</th><th>Profile</th><th>Status</th><th></th>
      </tr></thead><tbody>${pageRows.map(row=>{
        const d = normalizeIntakeData(row);
        const name = ((d.first||"")+" "+(d.last||"")).trim() || "Applicant";
        const profile = submissionProfileLabel(d);
        const status = String(row.status || "pending").toLowerCase();
        const statusClass = status === "approved" ? "green" : (status === "rejected" ? "amber" : "blue");
        const patient = findPatientForSubmission(row);
        return `<tr>
          <td>${esc(formatSubmissionWhen(row.submitted_at || row.created_at))}</td>
          <td>${patient
            ? `<button class="linkbtn" onclick="viewPatient('${patient.id}')">${esc(name)}</button>`
            : `<b>${esc(name)}</b>`}</td>
          <td>${esc(profile)}</td>
          <td><span class="tag ${statusClass}">${esc(status)}</span></td>
          <td style="text-align:right" class="row-actions">
            ${status === "pending" ? `<button class="btn sm primary" onclick="approveIntakeSubmission('${esc(row.id)}').then(()=>renderAppsSubmissionsList())">Approve</button>
              <button class="btn sm danger" onclick="rejectIntakeSubmission('${esc(row.id)}')">Reject</button>` : ""}
            <button class="btn sm" onclick="openSubmission('${esc(row.id)}')">Open</button>
          </td>
        </tr>`;
      }).join("")}</tbody></table>`;
  }
  let pageBtns = "";
  for(let i=0;i<totalPages;i++){
    pageBtns += `<button type="button" class="${i===_appsPage?"on":""}" onclick="appsSetPage(${i})">${i+1}</button>`;
  }
  box.innerHTML = `
    <div class="apps-submissions-scroll">${body}</div>
    <div class="apps-pager">
      <button type="button" ${ _appsPage<=0 ? "disabled" : "" } onclick="appsSetPage(${_appsPage-1})">Back</button>
      ${pageBtns}
      <button type="button" ${ _appsPage>=totalPages-1 ? "disabled" : "" } onclick="appsSetPage(${_appsPage+1})">Next</button>
      <span class="apps-pager-label">Page ${_appsPage+1} of ${totalPages}</span>
    </div>`;
  if(!window._appsResizeBound){
    window._appsResizeBound = true;

}
function patientProfileTagClass(label){

}

function captureChartProfile(){
  const p = patientById(chartBrowse.id);
  if(!p) return;
  const val = id => { const e = document.getElementById(id); return e ? String(e.value||"").trim() : null; };
  const set = (key, id) => { if(document.getElementById(id)) p[key] = val(id); };
  set("first","cp_first");
  set("last","cp_last");
  set("dob","cp_dob");
  if(document.getElementById("cp_sex")){ p.sex = val("cp_sex"); p.gender = val("cp_sex"); }
  set("phone","cp_phone");
  set("email","cp_email");
  set("occupation","cp_occupation");
  set("address","cp_address");
  set("insurance","cp_insurance");
  set("policy","cp_policy");
  set("group","cp_group");
  set("profileType","cp_profileType");
  if(document.getElementById("cp_holder")){
    const holder = val("cp_holder");
    p.insuranceHolderIsPatient = holder === "Patient";
    p.insuranceHolderName = holder === "Patient" ? "" : (val("cp_holder_name") || p.insuranceHolderName || "");
  }
  set("chiefComplaint","cp_chiefComplaint");
  set("medicalHistory","cp_medicalHistory");
  set("medications","cp_medications");

  chartEditing = false;

function chartPager(kind, page, totalPages){
  if(totalPages <= 1) return "";
  const setPage = (p)=>{ chartBrowse[kind+"Page"] = p; renderPatientChart(true); };
  let btns = "";
  for(let i=0;i<totalPages;i++){
    btns += `<button type="button" class="${i===page?"on":""}" onclick="chartBrowse.${kind}Page=${i};renderPatientChart(true)">${i+1}</button>`;
  }
  return `<div class="chart-pager no-print">${btns}</div>`;
}
function chartPagedList(items, pageKey, renderRow){
  const page = chartBrowse[pageKey] || 0;
  const totalPages = Math.max(1, Math.ceil(items.length / CHART_PAGE_SIZE));
  const safePage = Math.min(page, totalPages - 1);
  chartBrowse[pageKey] = safePage;
  const slice = items.slice(safePage * CHART_PAGE_SIZE, safePage * CHART_PAGE_SIZE + CHART_PAGE_SIZE);
  return (slice.length ? slice.map(renderRow).join("") : `<div class="muted">None yet.</div>`) + chartPager(pageKey.replace("Page",""), safePage, totalPages);
}

async function deletePatient(id){
  if(!await portalConfirm("Delete this patient and ALL their notes, histories, exams & invoices?")) return;
  ensureDbShape();
  const p = patientById(id);
  const name = fullName(p).toLowerCase();
  if(!DB.deletedPatientIds) DB.deletedPatientIds = [];
  if(!DB.deletedSubmissionIds) DB.deletedSubmissionIds = [];
  if(id) DB.deletedPatientIds.push(String(id));
  if(p && p.sourceSubmissionId) DB.deletedSubmissionIds.push(String(p.sourceSubmissionId));
  DB.patients = DB.patients.filter(x=>x.id!==id);
  DB.visits = DB.visits.filter(v=>v.patientId!==id);
  DB.invoices = DB.invoices.filter(v=>v.patientId!==id);
  DB.histories = (DB.histories||[]).filter(h=>h.patientId!==id);
  DB.exams = (DB.exams||[]).filter(e=>e.patientId!==id);
  try{
    if(window.PostureClinicSync && PostureClinicSync.listIntakeSubmissions){
      const rows = await PostureClinicSync.listIntakeSubmissions();
      for(const row of rows){
        const d = normalizeIntakeData(row);
        const rowName = ((d.first||"")+" "+(d.last||"")).trim().toLowerCase();
        const samePerson = (name && rowName === name) || (p && p.sourceSubmissionId && row.id === p.sourceSubmissionId) || (d.id && d.id === id);
        if(!samePerson) continue;
        if(row.id) DB.deletedSubmissionIds.push(String(row.id));
        try{
          await PostureClinicSync.updateIntakeSubmission(row.id, { status: "rejected", reviewed_at: new Date().toISOString() });
        }catch(e){ console.warn("Could not dismiss intake after delete", e); }
      }
    }
  }catch(e){ console.warn("Could not match intake after delete", e); }
  try{
    if(window.PostureClinicSync && typeof PostureClinicSync.saveSnapshot === "function"){
      await PostureClinicSync.saveSnapshot(DB, true);
    } else {
      save();
    }
  }catch(e){
    toast(e.message || "Deleted here, but could not update Supabase");
  }
  closeModal();
  toast("Patient deleted");
  go("patients");
}

function editPatient(id){ editingPatientId=id; go("intake"); }
function setPain(n){ $("#f_painLevel").value=n; document.querySelectorAll("#painScale button").forEach((b,i)=>b.classList.toggle("on",i===n)); }
function inpRaw(id,label,val,type){ return `<label>${label}</label>${type==='ta'?'':''}<input id="f_${id}" type="${type||'text'}" value="${esc(val||'')}"/>`; }
function inp(id,label,val,type){ return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type||'text'}" value="${esc(val||'')}"/></div>`; }
function sel(id,label,opts,val){ return `<div class="field"><label>${label}</label><select id="f_${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select></div>`; }
function dateField(id,label,val,start,end){ return `<div class="field"><label>${label}</label>${dateControl("f_"+id,val,start,end)}</div>`; }
function dateControl(id,val,start,end){
  return `<div class="date-combo"><input id="${id}" type="date" value="${esc(val||"")}"/><button type="button" title="Previous year" onclick="changeDateYear('${id}',-1,${start},${end})">&lsaquo;</button><button type="button" title="Next year" onclick="changeDateYear('${id}',1,${start},${end})">&rsaquo;</button></div>`;
}
function changeDateYear(id,delta,start,end){
  const e=$("#"+id); if(!e) return;
  const base = e.value || todayISO();
  const y = Math.min(end, Math.max(start, (Number(base.slice(0,4))||new Date().getFullYear()) + delta));
  e.value = y + base.slice(4);
  const sel = e.parentElement.querySelector("select"); if(sel) sel.value = y;
}
function fv(id){ const e=$("#f_"+id); return e?e.value.trim():""; }

const EXAM_PAIN_SHAPES = ["Constant","On & Off","Travelling","Numbness","Tingling"];
const EXAM_TEST_GROUPS = [
  { key:"cervical", title:"Cervical Spine", cols:2, tests:["Spurling","Kemps","Distraction Test","Jackson Test"] },
  { key:"thoracic", title:"Thoracic Spine", cols:2, tests:["Lateral Rib Compression Test","Anterior/Posterior Rib Compression Test"] },
  { key:"lumbar", title:"Lumbar and Sacral Spine", cols:2, tests:[
    "Valsalva's Maneuver","Bowstring Test","Thomas Test","Patrick or FABER Test","Yeoman's Test","Piriformis Test",
    "SLR","Sitting Root Test","Gaenslen's Test","Trendelenburg's Test","Ober's Test","Ely's Test"
  ]},
  { key:"shoulder", title:"Shoulder", cols:3, tests:[
    "Empty Can Test","Apley's Scratch Test","AC Joint Distraction Test","Yergason Test","Neer Test","Apprehension Test",
    "Speed's Test","Hawkins-Kennedy Test","Drop Arm Test","SC Joint Stress Test","Shoulder Adduction Test"
  ]},
  { key:"elbow", title:"Elbow", cols:3, tests:["Cozen's Test","Golfer's Test","Varus Test","Valgus Test","Tinel's Sign"] },
  { key:"knee", title:"Knee", cols:3, tests:[
    "Patellar Apprehension Test","Posterior Drawer Test","Clarke's Sign","Valgus Stress Test","Varus Stress Test",
    "Noble Test","McMurray Test","Anterior Drawer Test","Apley Compression Test"
  ]},
  { key:"ankle", title:"Ankle and Foot", cols:2, tests:[
    "Homans' Sign","Thompson Test","Anterior Drawer Test","Talar Tilt Test (Inversion)","Talar Tilt Test (Eversion)",
    "Kleiger's Test","Tinel's Sign"
  ]}
];
const EXAM_SPINE_GROUPS = EXAM_TEST_GROUPS.filter(g=>["cervical","thoracic","lumbar"].includes(g.key));
const EXAM_EXTREMITY_GROUPS = EXAM_TEST_GROUPS.filter(g=>["shoulder","elbow","knee","ankle"].includes(g.key));

function blankExamTests(){
  const tests = {};
  EXAM_TEST_GROUPS.forEach(g=>{ tests[g.key] = {}; g.tests.forEach(t=>{ tests[g.key][t] = false; }); });
  return tests;
}
function blankExam(patientId){
  const p = patientById(patientId) || DB.patients[0] || null;
  return {
    id: uid(),
    patientId: (p && p.id) || patientId || "",
    date: todayISO(),
    job: (p && (p.occupation || "")) || "",
    appearance: "",
    presentComplaint: "",
    howLong: "",
    painShape: [],
    vas: "",
    historyOfPc: "",
    redFlag: "",
    aggravate: "",
    decrease: "",
    pastMedicalHistory: "",
    medications: "",
    familyHistory: "",
    posture: "",
    spine: "",
    gait: "",
    rom: "",
    motionPalpation: "",
    tenderness: "",
    tightness: "",
    dx: "",
    tx: "",
    pain: {},
    tests: blankExamTests()
  };
}
function normalizeExam(raw){
  const base = blankExam(raw && raw.patientId);
  const e = Object.assign(base, raw || {});
  e.painShape = Array.isArray(e.painShape) ? e.painShape.slice() : [];
  e.pain = (e.pain && typeof e.pain === "object") ? e.pain : {};
  e.tests = blankExamTests();
  const src = (raw && raw.tests && typeof raw.tests === "object") ? raw.tests : {};
  EXAM_TEST_GROUPS.forEach(g=>{
    const groupSrc = src[g.key] && typeof src[g.key] === "object" ? src[g.key] : {};
    g.tests.forEach(t=>{ e.tests[g.key][t] = !!groupSrc[t]; });
  });
  // Migrate older free-text exam notes into matching fields when empty
  if(!e.posture && raw && raw.observation) e.posture = raw.observation;
  if(!e.rom && raw && raw.rom) e.rom = raw.rom;
  if(!e.motionPalpation && raw && raw.palpation) e.motionPalpation = raw.palpation;
  if(!e.dx && raw && raw.impression) e.dx = raw.impression;
  if(!e.presentComplaint && raw && raw.orthopedic) e.presentComplaint = raw.orthopedic;
  return e;
}

function painSelectionCount(){
  return Object.keys(activePain||{}).filter(k=>{
    if(k === "Other") return !!(activePain.Other && String(activePain.Other.note||"").trim());
    return !!activePain[k];
  }).length;
}
function clearAllPain(){
  if(!activePain || typeof activePain !== "object") return;
  Object.keys(activePain).forEach(k=>delete activePain[k]);
  document.querySelectorAll('.hot').forEach(g=>g.classList.remove('marked'));
  renderPainItems();
}
function selectAllPain(){
  if(!activePain || typeof activePain !== "object") return;
  BODY_REGIONS.forEach(k=>{
    if(k === "Other") return;
    if(!activePain[k]) activePain[k] = { intensity:5, type:"" };
  });
  document.querySelectorAll('.hot').forEach(g=>{
    const l = g.getAttribute('data-region');
    g.classList.toggle('marked', !!activePain[l]);
  });
  renderPainItems();
}
function painRegionSelectableCount(){
  return BODY_REGIONS.filter(k=>k !== "Other").length;
}
function updatePainOther(el){
  const t = (el.value||"").trim();
  if(t) activePain.Other = { intensity:5, type:"", note:t };
  else delete activePain.Other;
  el.closest(".painitem")?.classList.toggle("selected", !!t);
  syncPainToolbarButtons();
}
function painActionButtonsHtml(){
  const selectedCount = painSelectionCount();
  const markedRegions = BODY_REGIONS.filter(k=>k !== "Other" && activePain[k]).length;
  const allSelected = markedRegions >= painRegionSelectableCount();
  return `<button type="button" class="btn sm" data-pain-action="select" ${allSelected?"disabled":""} onclick="selectAllPain()" title="Mark all body regions">Select all</button>
    <button type="button" class="btn sm" data-pain-action="deselect" ${selectedCount?"":"disabled"} onclick="clearAllPain()" title="Clear all marked pain areas">Deselect all</button>`;
}
function syncPainToolbarButtons(){
  const host = $("#painMapActions") || $("#painItems")?.querySelector(".pain-clear-row");
  if(!host) return;
  const count = painSelectionCount();
  const deselect = host.querySelector('[data-pain-action="deselect"]');
  const select = host.querySelector('[data-pain-action="select"]');
  if(deselect) deselect.disabled = !count;
  if(select){
    const marked = BODY_REGIONS.filter(k=>k !== "Other" && activePain[k]).length;
    select.disabled = marked >= painRegionSelectableCount();
  }
}

    return;
  }

  const patients = DB.patients.slice()
    .map(p=>{

function invTotals(v){
  const sub = v.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
  const disc = Number(v.discount)||0;
  const tax = (sub-disc)*(Number(v.taxRate)||0)/100;
  const total = sub-disc+tax;
  const paid = paymentTotal(v);
  return { sub, disc, tax, total, paid, balance: Math.max(0,total-paid) };
}
function paymentTotal(v){
  const history = (v.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  return Math.max(0, history + (Number(v.paidAmount)||0));
}

  if(p.insurance) bits.push(p.insurance);

  if(p.group) bits.push("Group # " + p.group);
  return bits.join(" · ");

function paymentMethodOf(p){
  if(p && p.method) return p.method;
  const n = String((p && p.note) || "");
  const found = PAY_METHODS.find(m => n === m || n.startsWith(m + " —") || n.startsWith(m + " -"));
  return found || "Cash";
}
function paymentNoteOf(p){
  if(p && p.method) return String(p.note || "");
  const method = paymentMethodOf(p);
  const n = String((p && p.note) || "");
  if(n === method) return "";
  if(n.startsWith(method + " — ")) return n.slice(method.length + 3);
  if(n.startsWith(method + " - ")) return n.slice(method.length + 3);
  return n;
}
function paymentDisplay(p){
  const method = paymentMethodOf(p);
  const extra = paymentNoteOf(p);
  return extra ? `${method} — ${extra}` : method;
}
function persistInvoiceDraft(msg){

        </div></td>
      </tr>`;
    }).join("")}</tbody></table>`
    : `<div class="muted" style="margin-bottom:8px">No payments recorded yet.</div>`;

function savePayment(id, quiet){

    if($("#pay_edit_date")) pay.date = $("#pay_edit_date").value || pay.date;

function deletePayment(id){

function timeQuickSelect(){ return `<select class="btn sm" style="width:116px" onchange="if(this.value){$('#a_time').value=this.value;this.value=''}"><option value="">Quick time</option>${workSlots().map(t=>`<option value="${t}">${t}</option>`).join("")}</select>`; }
function setNowTime(){ const d=new Date(); $("#a_time").value=normalizeTime30(`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`); }
function timeToMin(t){ const [h,m]=(t||"").split(":").map(Number); return (h||0)*60+(m||0); }
function minToTime(n){ n=(n+1440)%1440; return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0"); }
function normalizeTime30(t){ if(!/^\d{1,2}:\d{2}$/.test(t||"")) return ""; return minToTime(Math.round(timeToMin(t)/30)*30); }
function slotTimes(start,end){ const out=[]; for(let m=timeToMin(start);m<=timeToMin(end);m+=30) out.push(minToTime(m)); return out; }
function workSlots(){
  const start=DB.clinic.workStart||"08:00", end=DB.clinic.workEnd||"18:00";
  return slotTimes(start,end);
}
function dparse(s){ const [y,m,d]=(s||todayISO()).split("-").map(Number); return new Date(y,m-1,d); }
function diso(d){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function dadd(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); return x; }
function add30(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number), d=new Date(2000,0,1,h||0,m||0); d.setMinutes(d.getMinutes()+30); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function apptsOn(date){ return DB.appointments.filter(a=>a.date===date).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
function apptColor(id){ let h=0; for(const c of String(id||"")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h},75%,88%)`; }
function apptChip(a){ const bg=apptColor(a.patientId); return `<button class="appt-chip" style="background:${bg};border-color:${bg};color:#0f172a" onclick="editAppt('${a.id}')" title="Edit appointment"><b>${esc(a.time||"")} - ${esc(add30(a.time)||"")} (${esc(fullName(patientById(a.patientId)))})</b>${esc(a.reason||"30 minute visit")}</button>`; }
function setCalView(v){ calView=v; if(v==="day") calDate=todayISO(); views.calendar(); }
function goToday(){ calDate=todayISO(); views.calendar(); }
function jumpCalDate(){ calDate=$("#cal_jump")?.value||calDate; views.calendar(); }
function moveCal(dir){
  const d=dparse(calDate);
  if(calView==="day") calDate=diso(dadd(d,dir));
  if(calView==="week") calDate=diso(dadd(d,dir*7));
  if(calView==="month"){ d.setMonth(d.getMonth()+dir); calDate=diso(d); }
  if(calView==="year"){ d.setFullYear(d.getFullYear()+dir); calDate=diso(d); }
  views.calendar();
}
function renderCalendar(){
  const box=$("#calendarView"), title=$("#calTitle"); if(!box||!title) return;
  const d=dparse(calDate), months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  if(calView==="day"){
    title.textContent = d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const slots = Array.from(new Set([...workSlots(), ...apptsOn(calDate).map(a=>normalizeTime30(a.time))])).filter(Boolean).sort();
    box.innerHTML = `<div class="time-grid" style="grid-template-columns:86px 1fr">
      <div class="time-head">Time</div><div class="time-head">${d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</div>
      ${slots.map(t=>{ const a=apptsOn(calDate).filter(x=>normalizeTime30(x.time)===t);
        return `<div class="time-label">${t}</div><div class="time-cell">${a.map(apptChip).join("")}</div>`; }).join("")}</div>`;
  } else if(calView==="week"){
    const start=startWeek(d), days=[0,1,2,3,4,5,6].map(i=>dadd(start,i));
    title.textContent = `${days[0].toLocaleDateString()} - ${days[6].toLocaleDateString()}`;
    const weekAppts = days.flatMap(x=>apptsOn(diso(x)).map(a=>normalizeTime30(a.time)));
    const slots = Array.from(new Set([...workSlots(), ...weekAppts])).filter(Boolean).sort();
    box.innerHTML = `<div class="time-grid" style="grid-template-columns:86px repeat(7,1fr)">
      <div class="time-head">Time</div>${days.map(x=>`<div class="time-head">${x.toLocaleDateString(undefined,{weekday:"short"})}<br>${x.getMonth()+1}/${x.getDate()}</div>`).join("")}
      ${slots.map(t=>`<div class="time-label">${t}</div>${days.map(x=>{ const a=apptsOn(diso(x)).filter(y=>normalizeTime30(y.time)===t);
        return `<div class="time-cell">${a.map(apptChip).join("")}</div>`; }).join("")}`).join("")}</div>`;
  } else if(calView==="month"){
    const first=new Date(d.getFullYear(),d.getMonth(),1), start=startWeek(first);
    const days=Array.from({length:42},(_,i)=>dadd(start,i));
    title.textContent = `${months[d.getMonth()]} ${d.getFullYear()}`;
    box.innerHTML = `<div class="calendar-grid" style="grid-template-columns:repeat(7,1fr)">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-day-head">${x}</div>`).join("")}${days.map(x=>`<div class="cal-cell ${x.getMonth()!==d.getMonth()?'cal-muted':''}" onclick="calDate='${diso(x)}';calView='day';views.calendar()"><div class="cal-date">${x.getDate()}</div>${apptsOn(diso(x)).slice(0,3).map(apptChip).join("")}${apptsOn(diso(x)).length>3?`<span class="hint">+${apptsOn(diso(x)).length-3} more</span>`:""}</div>`).join("")}</div>`;
  } else {
    title.textContent = `${d.getFullYear()}`;
    box.innerHTML = `<div class="year-grid">${months.map((m,i)=>{ const list=DB.appointments.filter(a=>{ const x=dparse(a.date); return x.getFullYear()===d.getFullYear() && x.getMonth()===i; }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
      return `<div class="month-card" onclick="calDate='${d.getFullYear()}-${String(i+1).padStart(2,"0")}-01';calView='month';views.calendar()"><h4>${m}</h4>${list.slice(0,4).map(a=>`<div class="appt-chip"><b>${esc(a.date)} ${esc(a.time||"")} - ${esc(add30(a.time)||"")}</b>${esc(fullName(patientById(a.patientId)))}</div>`).join("")||'<span class="muted">No bookings</span>'}${list.length>4?`<div class="hint">+${list.length-4} more</div>`:""}</div>`; }).join("")}</div>`;
  }
}

async function runClinicBackup(quiet){

      stamp: backupStamp(),

/* Build table data as {name, headers:[...], rows:[[...],...]} — shared by CSV and Excel */
function painIntensityLabel(p){ if(!p) return "0"; const n = p.intensity; return (n != null && n !== "") ? String(n) : "0"; }
function painSummary(pain){ return Object.keys(pain||{}).map(k=>{ const p=pain[k]; return `${k}(${painIntensityLabel(p)}${p.type?"/"+p.type:""})`; }).join("; "); }
function itemsSummary(items){ return (items||[]).map(it=>`${it.qty||0}x ${it.desc||it.code||""} @${(Number(it.price)||0).toFixed(2)}`.trim()).join("; "); }
function exportTable(name){
  const P=DB.patients, name2=id=>fullName(patientById(id));
  switch(name){
    case "patients": return { name:"Patients",
      headers:["ID","First","Last","DOB","Sex","Phone","Email","Occupation","Address","Insurance","Policy","Group","Emergency Name","Emergency Relationship","Emergency Phone","Chief Complaint","Pain Onset","Pain Type","Pain Level","Pain Frequency","Areas of Pain","Medical History","Medications","Allergies","Prior Treatment","Smoker","Exercise","Pregnant","Consent","Created"],
      rows:P.map(p=>[p.id,p.first,p.last,p.dob,p.sex,p.phone,p.email,p.occupation,p.address,p.insurance,p.policy,p.group,p.emergencyName,p.emergencyRel,p.emergencyPhone,p.chiefComplaint,p.painOnset,p.painType,p.painLevel,p.painFreq,painSummary(p.pain),p.medicalHistory,p.medications,p.allergies,p.priorTreatment,p.smoker,p.exercise,p.pregnant,p.consent?"Yes":"No",p.created]) };
    case "visits": return { name:"SOAP Notes",
      headers:["ID","Date","Patient","Patient ID","Services Provided","Areas of Pain","Subjective","Objective","Assessment","Plan"],
      rows:DB.visits.map(v=>[v.id,v.date,name2(v.patientId),v.patientId,soapServiceSummary(v),painSummary(v.pain),v.subjective,v.objective,v.assessment,v.plan]) };
    case "invoices": return { name:"Invoices",
      headers:["Invoice #","ID","Date","Patient","Patient ID","Status","Line Items","Discount","Tax Rate %","Total","Amount Paid","Outstanding Balance","Notes"],
      rows:DB.invoices.map(i=>{ const t=invTotals(i); return [i.number,i.id,i.date,name2(i.patientId),i.patientId,i.status,itemsSummary(i.items),Number(i.discount)||0,Number(i.taxRate)||0,t.total,t.paid,t.balance,i.notes]; }) };
    case "invoiceItems": { const rows=[];
      DB.invoices.forEach(i=>(i.items||[]).forEach(it=>{ const qty=Number(it.qty)||0, price=Number(it.price)||0;
        rows.push([i.number,it.date||i.date,name2(i.patientId),it.code,it.desc,qty,price,qty*price]); }));
      return { name:"Invoice Items", headers:["Invoice #","Service Date","Patient","Code","Description","Qty","Price","Amount"], rows }; }
    case "invoicePayments": { const rows=[];
      DB.invoices.forEach(i=>{
        if(Number(i.paidAmount)||0) rows.push([i.number,i.date,name2(i.patientId),"Previous",Number(i.paidAmount)||0,"Recorded before payment history"]);
        (i.payments||[]).forEach(p=>rows.push([i.number,p.date,name2(i.patientId),p.id,Number(p.amount)||0,p.note]));
      });
      return { name:"Invoice Payments", headers:["Invoice #","Payment Date","Patient","Payment ID","Amount","Note / Method"], rows }; }
    case "appointments": return { name:"Appointments",
      headers:["ID","Date","Time","Patient","Patient ID","Reason"],
      rows:DB.appointments.map(a=>[a.id,a.date,a.time,name2(a.patientId),a.patientId,a.reason]) };
  }
}

function downloadBlob(content, filename, mime){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvCell(v){ const s=(v==null?"":String(v)); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function tableToCSV(t){ return "\uFEFF" + [t.headers, ...t.rows].map(r=>r.map(csvCell).join(",")).join("\r\n"); }
function exportCSV(name){

/* Excel via SpreadsheetML 2003 XML — opens in Excel & Google Sheets with multiple tabs, no libraries */
function xmlEsc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function xmlCell(v){
  if(typeof v==="number" && isFinite(v)) return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
}
function xmlSheet(t){
  const head=`<Row>${t.headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEsc(h)}</Data></Cell>`).join("")}</Row>`;
  const body=t.rows.map(r=>`<Row>${r.map(xmlCell).join("")}</Row>`).join("");
  return `<Worksheet ss:Name="${xmlEsc(t.name)}"><Table>${head}${body}</Table></Worksheet>`;
}
function exportExcel(){
  const tables=["patients","visits","invoices","invoiceItems","invoicePayments","appointments"].map(exportTable);
  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/></Style></Styles>
${tables.map(xmlSheet).join("\n")}
</Workbook>`;
  downloadBlob(xml, `posture-clinic-export-${todayISO()}.xls`, "application/vnd.ms-excel");
  toast("Excel workbook exported");
}

/* Auto-hide scrollbars: visible while scrolling, hidden shortly after */
(function setupAutoHideScrollbars(){
  const timers = new WeakMap();
  document.addEventListener("scroll", function(e){
    const el = e.target;
    if(!(el instanceof Element)) return;
    el.classList.add("show-scrollbar");
    const prev = timers.get(el);
    if(prev) clearTimeout(prev);
    timers.set(el, setTimeout(function(){ el.classList.remove("show-scrollbar"); }, 900));
  }, true);
})();

      };
      if(btn) btn.addEventListener("click", window.togglePortalTheme);
      if(!document.documentElement.dataset.ui) document.documentElement.dataset.ui = "neumorphism";
    })();
    const menuBtn = document.getElementById("mobileMenuBtn");
    const backdrop = document.getElementById("mobileNavBackdrop");
    function closeMobileNav(){
      document.body.classList.remove("mobile-nav-open");
      if(menuBtn) menuBtn.setAttribute("aria-expanded","false");
      if(backdrop) backdrop.hidden = true;
    }
    function openMobileNav(){
      document.body.classList.add("mobile-nav-open");
      if(menuBtn) menuBtn.setAttribute("aria-expanded","true");
      if(backdrop) backdrop.hidden = false;
    }
    if(menuBtn) menuBtn.addEventListener("click", ()=>{
      if(document.body.classList.contains("mobile-nav-open")) closeMobileNav(); else openMobileNav();
    });
    if(backdrop) backdrop.addEventListener("click", closeMobileNav);
    document.querySelectorAll("#nav a").forEach(el=>{
      el.addEventListener("click", ()=>{ if(document.documentElement.classList.contains("is-phone")) closeMobileNav(); });
    });
    const searchBtn = document.getElementById("mobileSearchBtn");
    if(searchBtn) searchBtn.addEventListener("click", ()=>document.body.classList.toggle("mobile-search-open"));

    const allowed = await PosturePortalAuth.requireAppAccess();
    if(!allowed) return;
    await initStorage();
    startLiveIntakeWatch();
    refreshApplicationsBadge();
  }catch(e){
    console.error("Portal boot failed", e);
    try{ toast(e.message || "Could not start portal"); }catch(_){}
  }finally{
    document.documentElement.style.visibility = "";
  }
})();
</script>
</body>
</html>
