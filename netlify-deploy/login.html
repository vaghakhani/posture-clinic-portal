<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Login | Posture Clinic Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="Logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="Logo.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="Logo.png" />
  <link rel="apple-touch-icon" href="Logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1a33" />
  <meta name="application-name" content="Posture Clinic" />
  <meta name="apple-mobile-web-app-title" content="Posture Clinic" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileImage" content="Logo.png" />
  <meta name="msapplication-TileColor" content="#0b1a33" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal-theme.css?v=5" />
</head>
<body class="center-page">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <img class="brand-logo" src="Logo.png" alt="Posture Clinic" width="120" height="120" />
        <p class="brand-caption">Staff Portal</p>
      </div>
      <h1>Staff sign in</h1>
      <p class="sub">Use your authorized clinic account. Access is limited to approved staff only.</p>

      <div class="status error" id="error" hidden></div>
      <div class="status success" id="success" hidden></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input class="field-input" id="email" type="email" autocomplete="username" required placeholder="you@email.com" />

        <label for="password">Password</label>
        <input class="field-input" id="password" type="password" autocomplete="current-password" required placeholder="Your password" />

        <div class="actions">
          <button class="btn btn-primary" type="submit" id="submitBtn">Sign in to Portal</button>
          <button class="btn" type="button" id="googleBtn">Continue with Google</button>
        </div>
      </form>

      <p class="hint">
        Sign in with Clerk using your clinic email or Google.
        If you do not have access, contact the clinic administrator.
      </p>
    </div>
    <p class="back"><a href="https://vaghakhani.github.io/posture-clinic-website/">← Back to public website</a></p>
  </div>

  <script src="auth-config.js?v=5"></script>
  <script src="auth.js?v=6"></script>
  <script src="login.js?v=5"></script>
</body>
</html>
