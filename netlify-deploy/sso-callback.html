<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Completing sign in | Posture Clinic Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="Logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="Logo.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="Logo.png" />
  <link rel="apple-touch-icon" href="Logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1a33" />
  <meta name="application-name" content="Posture Clinic" />
  <meta name="apple-mobile-web-app-title" content="Posture Clinic" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileImage" content="Logo.png" />
  <meta name="msapplication-TileColor" content="#0b1a33" />
  <link rel="stylesheet" href="portal-theme.css?v=5" />
</head>
<body class="center-page">
  <main class="callback-card">
    <img class="brand-logo" src="Logo.png" alt="Posture Clinic" width="58" height="58" />
    <strong>Completing secure sign-in</strong>
    <p id="callbackCopy">Please wait while your clinic portal session is created.</p>
  </main>
  <script src="auth-config.js?v=5"></script>
  <script src="auth.js?v=6"></script>
  <script>
    PosturePortalAuth.completeOAuthReturn().catch(function (error) {
      document.getElementById("callbackCopy").textContent = error.message || "Sign-in could not be completed.";
      setTimeout(function () {
        location.replace(PosturePortalAuth.getConfig().loginPage || "login.html");
      }, 2600);
    });
  </script>
</body>
</html>
