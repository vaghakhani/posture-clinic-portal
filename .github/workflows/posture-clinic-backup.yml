name: Posture Clinic backups

on:
  schedule:
    # Every 6 hours (was every 10 minutes — too frequent / noisy on failures)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create dated portal and database backups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_TO_GIT: "0"
        run: |
          set -euo pipefail
          if [ -f "netlify-deploy/scripts/github-backup.sh" ]; then
            bash netlify-deploy/scripts/github-backup.sh
          elif [ -f "scripts/github-backup.sh" ]; then
            bash scripts/github-backup.sh
          elif [ -f "Posture Clinic Portal/scripts/github-backup.sh" ]; then
            bash "Posture Clinic Portal/scripts/github-backup.sh"
          else
            echo "Backup script not found" && exit 1
          fi
      - name: Upload private backup artifact (no git commit of PHI)
        uses: actions/upload-artifact@v4
        with:
          name: posture-clinic-backup-${{ github.run_id }}
          path: |
            backups/
            Posture Clinic Portal/backups/
            netlify-deploy/backups/
          if-no-files-found: warn
          retention-days: 30
