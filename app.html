<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Posture Clinic — Dr. Ardeshir Ekhtiari</title>
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand-dark:#1e40af; --brand-soft:#dbeafe;
    --accent:#0891b2; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
    --text:#0f172a; --soft:#f1f5f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--soft)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .app{display:flex;height:100vh;overflow:hidden}

  /* Sidebar */
  .sidebar{width:230px;background:linear-gradient(180deg,#1e40af,#2563eb);color:#e0edff;display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.15)}
  .brand h1{font-size:18px;margin:0;letter-spacing:.3px}
  .brand p{margin:4px 0 0;font-size:12px;opacity:.85}
  .nav{padding:10px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;color:#e0edff;text-decoration:none;font-size:14px;margin-bottom:4px}
  .nav a:hover{background:rgba(255,255,255,.12)}
  .nav a.active{background:#fff;color:#1e40af;font-weight:600}
  .nav .ic{width:20px;text-align:center}
  .sb-foot{padding:12px;font-size:11px;opacity:.8;border-top:1px solid rgba(255,255,255,.15)}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}
  .topbar h2{margin:0;font-size:18px}
  .topbar .search{margin-left:auto;position:relative}
  .topbar .search input{width:300px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:20px;background:var(--soft)}
  .topbar .search::before{content:"\1F50D";position:absolute;left:11px;top:8px;font-size:13px;opacity:.6}
  .content{flex:1;overflow:auto;padding:22px}

  /* Cards / grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
  .stat .n{font-size:30px;font-weight:700;color:var(--brand-dark)}
  .stat .l{color:var(--muted);font-size:13px;margin-top:2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  .panel h3{margin:0 0 14px;font-size:16px}
  .panel .desc{color:var(--muted);font-size:13px;margin:-8px 0 16px}

  /* Buttons */
  .btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:9px;font-size:14px;color:var(--text)}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* Forms */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .grid.four{grid-template-columns:repeat(4,1fr)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
  .field textarea{resize:vertical;min-height:70px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .date-combo{display:flex;gap:6px}
  .date-combo input{flex:1}
  .date-combo button{width:34px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brand-dark);font-weight:700}
  .date-combo button:hover{background:var(--brand-soft)}
  .sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-dark);margin:22px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--brand-soft)}
  .sec-title:first-child{margin-top:0}

  /* Table */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  tbody tr:hover{background:var(--soft)}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .tag.green{background:#dcfce7;color:#15803d}
  .tag.blue{background:#dbeafe;color:#1d4ed8}
  .tag.amber{background:#fef3c7;color:#92400e}
  .linkbtn{border:0;background:none;padding:0;color:var(--brand-dark);font-weight:700;text-align:left;cursor:pointer}
  .linkbtn:hover{text-decoration:underline}
  .email-value{word-break:break-all;color:var(--brand-dark);text-decoration:none}
  .email-value:hover{text-decoration:underline}
  .profile-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0 18px}
  .profile-card{border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:12px}
  .profile-card .v{font-size:19px;font-weight:800;color:var(--brand-dark)}
  .profile-card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .cal-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .cal-title{font-size:18px;font-weight:800;color:var(--brand-dark);margin-right:auto}
  .calendar-grid{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .time-grid{display:grid;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:620px;background:#fff}
  .time-head{position:sticky;top:0;z-index:2;background:#eff6ff;color:var(--brand-dark);font-weight:800;text-align:center;padding:9px;border-right:1px solid #bfdbfe;border-bottom:1px solid #bfdbfe}
  .time-label{background:#f8fafc;color:#64748b;font-size:12px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
  .time-cell{min-height:42px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;background:#fff}
  .cal-cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:#fff}
  .cal-cell:nth-child(7n){border-right:0}
  .cal-day-head{background:#eff6ff;color:var(--brand-dark);font-weight:800;text-align:center;padding:9px;border-right:1px solid #bfdbfe}
  .cal-day-head:nth-child(7n){border-right:0}
  .cal-date{font-size:12px;font-weight:800;color:#334155;margin-bottom:6px}
  .cal-muted{background:#f8fafc;color:#94a3b8}
  .appt-chip{display:block;border:1px solid #bfdbfe;background:#dbeafe;color:#1e3a8a;border-radius:8px;padding:5px 7px;margin:4px 0;font-size:12px;line-height:1.25;text-align:left;width:100%}
  .appt-chip b{display:block;color:#1e40af}
  .day-slot{display:grid;grid-template-columns:86px 1fr;border-bottom:1px solid var(--line);min-height:42px}
  .day-time{background:#f8fafc;color:#64748b;font-size:12px;padding:10px;border-right:1px solid var(--line);font-weight:700}
  .day-bookings{padding:7px}
  .year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .month-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .month-card h4{margin:0 0 8px;color:var(--brand-dark)}

  /* Pain diagram */
  .bodywrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .bodychart{position:relative;flex:1 1 520px;max-width:650px;min-width:300px}
  .bodychart img{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bodychart.noimg{min-height:420px;border:1px dashed var(--line);border-radius:14px;background:#fff}
  .chartmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:13px}
  .hot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:2px solid transparent;padding:0;cursor:pointer;transition:background .15s,border-color .15s}
  .hot:hover{background:rgba(37,99,235,.30);border-color:rgba(37,99,235,.55)}
  .hot.marked{background:rgba(239,68,68,.5);border-color:#b91c1c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .painlist{flex:1;min-width:240px}
  .painitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
  .painitem.selected{border-color:#fecaca;background:#fff7f7}
  .painitem .nm{flex:1;font-size:14px;font-weight:600}
  .painitem .nm.clickable{cursor:pointer}
  .painitem input[type="checkbox"]{width:auto}
  .painitem select{padding:5px 8px;border:1px solid var(--line);border-radius:7px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  /* Invoice */
  .inv-items th,.inv-items td{padding:8px}
  .inv-total{display:flex;justify-content:flex-end;margin-top:14px}
  .inv-total table{width:auto;min-width:280px}
  .inv-total td{border:none;padding:5px 10px}
  .inv-total .grand{font-size:18px;font-weight:700;color:var(--brand-dark)}
  .letterhead{border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:18px}
  .letterhead-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
  .letterhead-brand{display:flex;gap:14px;align-items:flex-start}
  .letterhead-logo{max-height:78px;max-width:190px;object-fit:contain}
  .letterhead-clinic{font-size:22px;font-weight:800;color:var(--brand-dark);letter-spacing:.2px}
  .letterhead-provider{font-size:14px;font-weight:600;color:#334155;margin-top:2px}
  .letterhead-contact{font-size:12px;color:#64748b;line-height:1.5;margin-top:4px}
  .letterhead-doc{text-align:right;min-width:220px}
  .letterhead-doc h2{margin:0;color:#111827;font-size:26px;text-transform:uppercase;letter-spacing:.5px}
  .letterhead-meta{font-size:12px;color:#475569;line-height:1.7;margin-top:8px}
  .clinical-doc{background:#fff;color:#111827}
  .clinical-head{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:16px}
  .clinical-brand{display:flex;align-items:flex-start;gap:12px}
  .clinical-logo{max-height:72px;max-width:180px;object-fit:contain}
  .clinical-title{text-align:right}
  .clinical-title h2{margin:0;color:var(--brand-dark);font-size:24px}
  .clinical-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
  .clinical-patient{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc}
  .clinical-section{margin-top:14px}
  .clinical-section h4{margin:0 0 6px;color:var(--brand-dark);font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .clinical-box{min-height:56px;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;background:#fff}
  .clinical-sign{margin-top:28px;margin-left:auto;width:320px;text-align:center}
  .clinical-sign img{max-height:64px;max-width:260px;object-fit:contain;margin-bottom:4px}
  .clinical-sign .line{border-top:1px solid #111827;padding-top:6px;font-size:12px;color:#334155}
  .print-only{display:none}
  .print-footer{display:none}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;overflow:hidden;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:960px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal.wide{max-width:1240px}
  .modal-head{display:flex;align-items:center;margin:-24px -24px 16px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:-24px;z-index:5}
  .modal-head h3{margin:0;font-size:18px}
  .modal-back{margin-right:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;color:var(--brand-dark);font-weight:700}
  .modal-back:hover{background:var(--brand-soft)}
  .modal-head .x{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted)}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin:22px -24px -24px;border-top:1px solid var(--line);padding:14px 24px;background:#fff;position:sticky;bottom:-24px;z-index:5}

  .toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;z-index:100}
  .toast.show{opacity:1;transform:translateY(0)}
  .muted{color:var(--muted)}
  .pill-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .pill-tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:20px;font-size:13px}
  .pill-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .settings-section{display:none}
  .settings-section.on{display:block}
  .hint{font-size:12px;color:var(--muted)}
  .scale{display:flex;gap:4px;flex-wrap:wrap}
  .scale button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
  .scale button.on{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* Print */
  @media print{
    @page{margin:.55in}
    .sidebar,.topbar,.no-print,.modal-foot,.modal-head{display:none !important}
    .app,.main,.content{display:block;height:auto;overflow:visible}
    body.modal-open .app{display:none !important}
    .modal-bg{position:static;background:none;display:block;padding:0}
    .modal{box-shadow:none;max-width:none;border-radius:0;padding:0}
    body{background:#fff}
    .content{padding:0}
    .panel{border:0;border-radius:0;padding:0;margin:0;background:#fff}
    .print-area{padding:0;font-size:12px;line-height:1.45}
    .print-only{display:block !important}
    .print-area input,.print-area textarea,.print-area select,
    body:not(.modal-open) .content input,body:not(.modal-open) .content textarea,body:not(.modal-open) .content select{border:0 !important;background:transparent !important;box-shadow:none !important;padding:0 !important;color:#111827 !important;-webkit-appearance:none;appearance:none}
    .print-area .date-combo button,
    body:not(.modal-open) .content .date-combo button{display:none !important}
    .print-area textarea,body:not(.modal-open) .content textarea{min-height:0;height:auto;resize:none;overflow:visible}
    .print-area table,body:not(.modal-open) .content table{page-break-inside:auto;border:1px solid #cbd5e1}
    .print-area th,body:not(.modal-open) .content th{background:#eff6ff;color:#1e40af;border-bottom:1px solid #bfdbfe;font-size:11px}
    .print-area td,body:not(.modal-open) .content td{border-bottom:1px solid #e2e8f0}
    .print-area tr{page-break-inside:avoid;page-break-after:auto}
    .inv-items th,.inv-items td{border-bottom:1px solid #d1d5db}
    .print-area .sec-title,body:not(.modal-open) .content .sec-title{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid var(--brand);border-radius:4px;color:#1e40af;padding:7px 9px;margin:18px 0 10px}
    .print-area .grid,body:not(.modal-open) .content .grid{gap:10px}
    .print-area .field,body:not(.modal-open) .content .field{border:1px solid #e2e8f0;border-radius:6px;padding:8px;background:#fbfdff;break-inside:avoid}
    .print-area .field label,body:not(.modal-open) .content .field label,.hint{color:#475569;font-size:10px;text-transform:uppercase;letter-spacing:.35px}
    .print-area p{margin:7px 0}
    .inv-total table{border:0}
    .inv-total td{border:0}
    .clinical-box{border:1px solid #cbd5e1;background:#fbfdff;border-radius:6px;min-height:68px}
    .clinical-sign{break-inside:avoid}
    .bodywrap{break-inside:auto;page-break-inside:auto;gap:12px}
    .bodychart{flex:0 1 3.7in;max-width:3.7in;min-width:2.6in}
    .bodychart img{max-height:4.4in;object-fit:contain}
    .painlist{min-width:2.2in;font-size:11px}
    .painitem{padding:5px 7px;margin-bottom:4px;break-inside:avoid}
    .painlist .hint,.painlist .painitem:not(.selected) .muted{display:none !important}
    .painlist .painitem:not(.selected){display:none !important}
    .painlist input[type="checkbox"]{display:none !important}
    .clinical-doc{font-size:12px}
    .clinical-patient{break-inside:avoid;grid-template-columns:repeat(2,1fr)}
    .clinical-section{break-inside:avoid}
    .print-footer{display:none !important}
    body::after{content:"Printed from Posture Clinic";position:fixed;bottom:.18in;right:.55in;font-size:10px;color:#64748b}
  }
</style>

<script>
/* ============================ DATA LAYER ============================ */
const DB_KEY = "postureclinic_db_v1";
const LEGACY_DB_KEY = "painclinic_db_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const DEFAULT_SERVICES = [
  {code:"98940", desc:"Chiropractic Manipulation (1-2 regions)", price:65},
  {code:"98941", desc:"Chiropractic Manipulation (3-4 regions)", price:85},
  {code:"97110", desc:"Therapeutic Exercise", price:45},
  {code:"97140", desc:"Manual Therapy", price:50},
  {code:"99203", desc:"New Patient Exam", price:150},
  {code:"99213", desc:"Established Patient Exam", price:90},
];
function loadDB(){
  try{
    let raw = localStorage.getItem(DB_KEY);
    if(!raw && LEGACY_DB_KEY){ raw = localStorage.getItem(LEGACY_DB_KEY); if(raw) localStorage.setItem(DB_KEY, raw); }
    return JSON.parse(raw) || seed();
  }catch(e){ return seed(); }
}
function seed(){
  const db = { patients:[], visits:[], invoices:[], appointments:[],
    clinic:{ name:"Posture Clinic", provider:"Dr. Ardeshir Ekhtiari, DC",
      address:"", phone:"647-835-8118", email:"Ardeshir@DrEkhtiari.com", taxRate:0, currency:"$", workStart:"08:00", workEnd:"18:00",
      services:JSON.parse(JSON.stringify(DEFAULT_SERVICES)),
      serviceProfiles:[{id:"default",name:"Default Chiropractic",services:JSON.parse(JSON.stringify(DEFAULT_SERVICES))}],
      activeServiceProfileId:"default" } };
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  return db;
}
let DB = loadDB();

/* ---- Portable file storage (data lives in a file that travels with the app) ---- */
let fileHandle = null;          // linked PostureClinicData.json handle
let needsReconnect = false;     // handle exists but permission must be re-granted (needs a click)
let _writeTimer = null, _dirty = false;

function save(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));   // fast local mirror
  scheduleFileWrite();                                // persist to portable data file
}
function scheduleFileWrite(){
  if(!fileHandle) return;
  _dirty = true; clearTimeout(_writeTimer);
  _writeTimer = setTimeout(writeFile, 500);
}
async function writeFile(){
  if(!fileHandle || !_dirty) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(DB, null, 2));
    await w.close();
    _dirty = false; updateStorageBadge();
  }catch(e){ console.warn("File write failed", e); }
}

/* IndexedDB: remember the linked file handle between sessions */
function idbOpen(name="postureclinic_fs"){ return new Promise((res,rej)=>{ const r=indexedDB.open(name,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("h","readwrite");
  t.objectStore("h").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("h","readonly");
  const rq=t.objectStore("h").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res)=>{ const t=db.transaction("h","readwrite");
  t.objectStore("h").delete(k); t.oncomplete=()=>res(); }); }

async function permGranted(h,write){ const o={mode:write?"readwrite":"read"};
  try{ return (await h.queryPermission(o))==="granted"; }catch(e){ return false; } }
async function permRequest(h,write){ const o={mode:write?"readwrite":"read"};
  try{ if((await h.queryPermission(o))==="granted") return true; return (await h.requestPermission(o))==="granted"; }catch(e){ return false; } }

const fsSupported = () => !!(window.showSaveFilePicker && window.showOpenFilePicker);

/* Create/choose the portable data file and start saving to it */
async function connectDataFile(){
  if(!fsSupported()){ toast("This browser can't link a data file. Use Export/Import backups instead."); return; }
  try{
    const h = await window.showSaveFilePicker({ suggestedName:"PostureClinicData.json",
      types:[{description:"Posture Clinic Data",accept:{"application/json":[".json"]}}] });
    fileHandle = h; needsReconnect=false; await idbSet("dataFile",h);
    _dirty = true; await writeFile();
    toast("Data file linked — everything now saves into this file.");
    updateStorageBadge(); if(current==="settings") views.settings();
  }catch(e){ if(e.name!=="AbortError") toast("Could not link data file"); }
}
/* Open an existing data file (e.g. after moving the folder to a new PC) */
async function openDataFile(){
  if(!fsSupported()){ toast("This browser can't open a data file. Use Import backup instead."); return; }
  try{
    const [h] = await window.showOpenFilePicker({ types:[{description:"Posture Clinic Data",accept:{"application/json":[".json"]}}] });
    if(!(await permRequest(h,true))) return;
    const txt = await (await h.getFile()).text();
    DB = JSON.parse(txt); fileHandle=h; needsReconnect=false; await idbSet("dataFile",h);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    toast("Loaded data from file."); go("dashboard");
  }catch(e){ if(e.name!=="AbortError") toast("Could not open data file"); }
}
async function disconnectDataFile(){ fileHandle=null; needsReconnect=false; await idbDel("dataFile"); updateStorageBadge(); if(current==="settings") views.settings(); toast("Unlinked data file (still saved locally)."); }

/* Re-grant permission after a restart (browsers require a click) */
async function reconnectDataFile(){
  const h = await idbGet("dataFile"); if(!h){ connectDataFile(); return; }
  if(await permRequest(h,true)){
    fileHandle=h; needsReconnect=false;
    try{ const txt=await (await h.getFile()).text(); if(txt.trim()){ DB=JSON.parse(txt); localStorage.setItem(DB_KEY,JSON.stringify(DB)); } }catch(e){}
    updateStorageBadge(); toast("Reconnected to data file."); go(current);
  }
}
function storageBadgeClick(){ if(needsReconnect) reconnectDataFile(); else if(fileHandle){ go("settings"); } else connectDataFile(); }
function updateStorageBadge(){
  const b = document.getElementById("storageBadge"); if(!b) return;
  if(needsReconnect){ b.textContent="\u26A0 Reconnect data file"; b.style.background="#fef3c7"; b.style.borderColor="#fcd34d"; b.title="Click to reconnect your data file"; }
  else if(fileHandle){ b.textContent="\uD83D\uDCBE Data file linked"; b.style.background="#dbeafe"; b.style.borderColor="#93c5fd"; b.title=fileHandle.name||"Linked"; }
  else if(fsSupported()){ b.textContent="\u26A0 Link data file"; b.style.background="#fee2e2"; b.style.borderColor="#fecaca"; b.title="Click to make your data portable"; }
  else { b.textContent="\uD83D\uDCBE Local only"; b.style.background=""; b.style.borderColor=""; b.title="Use Export/Import backups to move data"; }
}
async function idbGetLegacy(k){
  try{ const db=await idbOpen("painclinic_fs"); return new Promise((res,rej)=>{ const t=db.transaction("h","readonly");
    const rq=t.objectStore("h").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }catch(e){ return null; }
}
async function initStorage(){
  try{
    let h = await idbGet("dataFile");
    if(!h){ h = await idbGetLegacy("dataFile"); if(h) await idbSet("dataFile", h); }
    if(h){
      if(await permGranted(h,true)){
        fileHandle=h;
        try{ const txt=await (await h.getFile()).text(); if(txt.trim()){ DB=JSON.parse(txt); localStorage.setItem(DB_KEY,JSON.stringify(DB)); } }catch(e){}
      } else { needsReconnect=true; }
    }
  }catch(e){}
  const last = localStorage.getItem(LAST_VIEW_KEY) || localStorage.getItem(LEGACY_LAST_VIEW_KEY);
  go(views[last]?last:"dashboard"); updateStorageBadge();
}
const money = n => DB.clinic.currency + (Number(n)||0).toFixed(2);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const patientById = id => DB.patients.find(p=>p.id===id);
const fullName = p => p ? `${p.first||""} ${p.last||""}`.trim() : "Unknown";
const emailView = e => e ? `<a class="email-value" href="mailto:${esc(e)}">${esc(e)}</a>` : "—";

/* ============================ UI HELPERS ============================ */
const $ = s => document.querySelector(s);
const content = $("#content");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
let modalStack = [];
function openModal(html, wide, replace){
  const m=$("#modal"), bg=$("#modalBg");
  if(bg.classList.contains("open") && !replace) modalStack.push({html:m.innerHTML,className:m.className});
  m.className="modal"+(wide?" wide":""); m.innerHTML=html; bg.classList.add("open"); document.body.classList.add("modal-open");
  updateModalBack();
}
function updateModalBack(){
  const h=$("#modal .modal-head"); if(!h) return;
  h.querySelector(".modal-back")?.remove();
  if(modalStack.length) h.insertAdjacentHTML("afterbegin",`<button class="modal-back" onclick="modalBack()">&larr; Back</button>`);
}
function modalBack(){
  const prev = modalStack.pop(); if(!prev){ closeModal(); return; }
  const m=$("#modal"); m.className=prev.className; m.innerHTML=prev.html; updateModalBack();
}
function closeModal(){ $("#modalBg").classList.remove("open"); document.body.classList.remove("modal-open"); modalStack=[]; }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });
function printStamp(){ return new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function letterhead(title, rows){
  const c=DB.clinic, contact=[c.address,c.phone,c.email].filter(Boolean).join(" | ");
  return `<div class="letterhead">
    <div class="letterhead-top">
      <div class="letterhead-brand">
        ${c.logo?`<img class="letterhead-logo" src="${esc(c.logo)}" alt="Clinic logo"/>`:""}
        <div>
          <div class="letterhead-clinic">${esc(c.name||"Posture Clinic")}</div>
          <div class="letterhead-provider">${esc(c.provider||"Dr. Ardeshir Ekhtiari, DC")}</div>
          <div class="letterhead-contact">${esc(contact||"")}</div>
        </div>
      </div>
      <div class="letterhead-doc">
        <h2>${esc(title)}</h2>
        <div class="letterhead-meta">
          <div><b>Printed:</b> ${printStamp()}</div>
          ${(rows||[]).map(r=>`<div><b>${esc(r[0])}:</b> ${esc(r[1]||"—")}</div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================ ROUTER ============================ */
const views = {};
let current = "dashboard";
const LAST_VIEW_KEY = "postureclinic_last_view";
const LEGACY_LAST_VIEW_KEY = "painclinic_last_view";
const SCROLL_KEY = "postureclinic_scroll_";
const LEGACY_SCROLL_KEY = "painclinic_scroll_";
function go(view){
  if(content && current) localStorage.setItem(SCROLL_KEY+current, content.scrollTop);
  current = view;
  localStorage.setItem(LAST_VIEW_KEY, view);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.view===view));
  $("#viewTitle").textContent = {dashboard:"Dashboard",patients:"Patients",intake:"New Patient Intake",
    visits:"SOAP Notes",invoices:"Invoices",appointments:"Appointments",calendar:"Calendar",settings:"Settings & Backup"}[view];
  (views[view]||views.dashboard)();
  setTimeout(()=>{ content.scrollTop = Number(localStorage.getItem(SCROLL_KEY+view)||localStorage.getItem(LEGACY_SCROLL_KEY+view)||0); },0);
}
document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>go(a.dataset.view)));
content.addEventListener("scroll",()=>localStorage.setItem(SCROLL_KEY+current, content.scrollTop));
$("#globalSearch").addEventListener("input",e=>{
  if(current!=="patients"){ go("patients"); }
  const box = $("#patientSearch"); if(box){ box.value=e.target.value; renderPatientTable(e.target.value); }
});
function matchesText(q,...parts){
  q=(q||"").toLowerCase().trim();
  return !q || parts.join(" ").toLowerCase().includes(q);
}

function renderPatientTable(q){
  q=(q||"").toLowerCase().trim();
  const list = DB.patients.filter(p=>{
    if(!q) return true;
    return (fullName(p)+" "+(p.phone||"")+" "+(p.dob||"")+" "+(p.email||"")).toLowerCase().includes(q);
  }).sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  const el = $("#patientTable"); if(!el) return;
  el.innerHTML = list.length? `<table><thead><tr><th>Name</th><th>DOB</th><th>Phone</th><th>Chief Complaint</th><th>Visits</th><th></th></tr></thead>
    <tbody>${list.map(p=>{
      const v = DB.visits.filter(x=>x.patientId===p.id).length;
      return `<tr>
        <td><button class="linkbtn" onclick="viewPatient('${p.id}')">${esc(fullName(p))}</button></td>
        <td>${esc(p.dob||"")}</td>
        <td>${esc(p.phone||"")}</td>
        <td>${esc((p.chiefComplaint||"").slice(0,40))}</td>
        <td><span class="tag green">${v}</span></td>
        <td class="row-actions" style="justify-content:flex-end">
          <button class="btn sm" onclick="viewPatient('${p.id}')">Open</button>
          <button class="btn sm" onclick="newVisit('${p.id}')">SOAP</button>
          <button class="btn sm" onclick="newInvoice('${p.id}')">Invoice</button>
        </td></tr>`;
    }).join("")}</tbody></table>`
    : `<div class="empty">No matching patients.</div>`;
}

  const services = invs.reduce((s,i)=>s+(i.items||[]).reduce((n,it)=>n+(Number(it.qty)||0),0),0);
  const nextAppt = DB.appointments.filter(a=>a.patientId===id && a.date>=todayISO()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];

        <div class="profile-card"><div class="v">${esc(visits[0]?.date||"—")}</div><div class="k">Last Visit</div></div>

function deletePatient(id){
  if(!confirm("Delete this patient and ALL their notes & invoices?")) return;
  DB.patients = DB.patients.filter(p=>p.id!==id);
  DB.visits = DB.visits.filter(v=>v.patientId!==id);
  DB.invoices = DB.invoices.filter(v=>v.patientId!==id);
  save(); closeModal(); toast("Patient deleted"); go("patients");
}

function inp(id,label,val,type){ return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type||'text'}" value="${esc(val||'')}"/></div>`; }
function sel(id,label,opts,val){ return `<div class="field"><label>${label}</label><select id="f_${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select></div>`; }

  return `<div class="date-combo"><input id="${id}" type="date" value="${esc(val||"")}"/><button type="button" title="Previous year" onclick="changeDateYear('${id}',-1,${start},${end})">&lsaquo;</button><button type="button" title="Next year" onclick="changeDateYear('${id}',1,${start},${end})">&rsaquo;</button></div>`;
}
function changeDateYear(id,delta,start,end){
  const e=$("#"+id); if(!e) return;
  const base = e.value || todayISO();
  const y = Math.min(end, Math.max(start, (Number(base.slice(0,4))||new Date().getFullYear()) + delta));
  e.value = y + base.slice(4);
  const sel = e.parentElement.querySelector("select"); if(sel) sel.value = y;
}

  invoiceEditor();

function openInvoice(id){ invDraft = JSON.parse(JSON.stringify(DB.invoices.find(i=>i.id===id))); invoiceEditor(); }
function invTotals(v){
  const sub = v.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
  const disc = Number(v.discount)||0;
  const tax = (sub-disc)*(Number(v.taxRate)||0)/100;
  const total = sub-disc+tax;
  const paid = paymentTotal(v);
  return { sub, disc, tax, total, paid, balance: Math.max(0,total-paid) };
}
function paymentTotal(v){
  const history = (v.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  return Math.max(0, history + (Number(v.paidAmount)||0));
}

function renderInvRows(){

function updateAmounts(){ invoiceEditor(true); }
function addInvRow(){ invDraft.items.push({desc:"",code:"",qty:1,price:0}); invoiceEditor(true); }
function addService(i){ const s=DB.clinic.services[i]; invDraft.items.push({desc:s.desc,code:s.code,qty:1,price:s.price}); invoiceEditor(true); }
function paymentRows(){
  const rows = invDraft.payments || [];
  const legacy = Number(invDraft.paidAmount)||0;
  const legacyRow = legacy ? `<tr><td>Previous balance payment</td><td>${money(legacy)}</td><td>Recorded before payment history</td><td></td></tr>` : "";
  return rows.length || legacy ? `<table><thead><tr><th>Date</th><th>Amount</th><th>Note / Method</th><th></th></tr></thead>
    <tbody>${legacyRow}${rows.map(p=>`<tr><td>${esc(p.date||"")}</td><td>${money(p.amount)}</td><td>${esc(p.note||"")}</td>
      <td style="text-align:right"><button class="btn sm danger" onclick="deletePayment('${p.id}')">Remove</button></td></tr>`).join("")}</tbody></table>`
    : `<div class="muted">No payments recorded yet.</div>`;
}
function addPayment(){
  captureInvoiceForm();
  const amount = Number($("#pay_amount")?.value)||0;
  if(amount<=0){ toast("Enter a payment amount"); return; }
  invDraft.payments = invDraft.payments || [];
  invDraft.payments.push({id:uid(),date:$("#pay_date")?.value||todayISO(),amount,note:$("#pay_note")?.value||""});
  const bal=invTotals(invDraft).balance;
  invDraft.status = bal<=0 ? "Paid" : "Partial";
  const i=DB.invoices.findIndex(x=>x.id===invDraft.id);
  if(i>=0){ DB.invoices[i]=JSON.parse(JSON.stringify(invDraft)); save(); toast("Payment recorded"); }
  invoiceEditor(true);
}
function deletePayment(id){
  captureInvoiceForm();
  invDraft.payments = (invDraft.payments||[]).filter(p=>p.id!==id);
  const bal=invTotals(invDraft).balance;
  invDraft.status = bal<=0 ? "Paid" : (invTotals(invDraft).paid>0 ? "Partial" : "Unpaid");
  const i=DB.invoices.findIndex(x=>x.id===invDraft.id);
  if(i>=0){ DB.invoices[i]=JSON.parse(JSON.stringify(invDraft)); save(); toast("Payment removed"); }
  invoiceEditor(true);
}
function captureInvoiceForm(){
  if(!$("#i_patient")) return;
  invDraft.number=($("#i_number")?.value||invDraft.number).trim()||nextInvoiceNumber();
  invDraft.patientId=$("#i_patient").value; invDraft.date=$("#i_date").value||todayISO();
  invDraft.notes=$("#i_notes").value; invDraft.status=$("#i_status").value;
  invDraft.total=invTotals(invDraft).total;
  const bal=invTotals(invDraft).balance;
  invDraft.status = bal<=0 ? "Paid" : (invTotals(invDraft).paid>0 ? "Partial" : "Unpaid");
}
function printInvoice(){
  captureInvoiceForm();
  invoiceEditor(true);
  setTimeout(printModal,100);
}
function saveInvoice(){
  captureInvoiceForm();
  const i=DB.invoices.findIndex(x=>x.id===invDraft.id);
  if(i>=0)DB.invoices[i]=invDraft; else DB.invoices.push(invDraft);
  save(); closeModal(); toast("Invoice saved"); if(current==="invoices")views.invoices(); else if(current==="dashboard")views.dashboard();
}
function deleteInvoice(id){ if(!confirm("Delete invoice?"))return; DB.invoices=DB.invoices.filter(i=>i.id!==id); save(); closeModal(); toast("Invoice deleted"); if(current==="invoices")views.invoices(); }

function addAppt(){ if(!DB.patients.length){toast("Add a patient first");return;}

function editAppt(id){ editingApptId=id; go("appointments"); }
function delAppt(id){ DB.appointments=DB.appointments.filter(a=>a.id!==id); if(editingApptId===id) editingApptId=null; save(); views.appointments(); }
function renderAppointmentTable(q){

views.calendar = function(){
  content.innerHTML = `<div class="panel">
    <div class="cal-toolbar">
      <div class="cal-title" id="calTitle">Calendar</div>
      <button class="btn sm" onclick="moveCal(-1)">&lsaquo;</button>
      <button class="btn sm" onclick="goToday()">Today</button>
      <button class="btn sm" onclick="moveCal(1)">&rsaquo;</button>
      ${dateControl("cal_jump",calDate,2020,new Date().getFullYear()+5)}
      <button class="btn sm" onclick="jumpCalDate()">Go</button>
      ${["day","week","month","year"].map(v=>`<button class="btn sm ${calView===v?'primary':''}" onclick="setCalView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}
      <button class="btn primary sm" onclick="go('appointments')">+ Appointment</button>
    </div>
    <div id="calendarView"></div>
  </div>`;
  renderCalendar();
};
function timeQuickSelect(){ return `<select class="btn sm" style="width:116px" onchange="if(this.value){$('#a_time').value=this.value;this.value=''}"><option value="">Quick time</option>${workSlots().map(t=>`<option value="${t}">${t}</option>`).join("")}</select>`; }
function setNowTime(){ const d=new Date(); $("#a_time").value=normalizeTime30(`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`); }
function timeToMin(t){ const [h,m]=(t||"").split(":").map(Number); return (h||0)*60+(m||0); }
function minToTime(n){ n=(n+1440)%1440; return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0"); }
function normalizeTime30(t){ if(!/^\d{1,2}:\d{2}$/.test(t||"")) return ""; return minToTime(Math.round(timeToMin(t)/30)*30); }
function slotTimes(start,end){ const out=[]; for(let m=timeToMin(start);m<=timeToMin(end);m+=30) out.push(minToTime(m)); return out; }
function workSlots(){
  const start=DB.clinic.workStart||"08:00", end=DB.clinic.workEnd||"18:00";
  return slotTimes(start,end);
}
function dparse(s){ const [y,m,d]=(s||todayISO()).split("-").map(Number); return new Date(y,m-1,d); }
function diso(d){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function dadd(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); return x; }
function add30(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number), d=new Date(2000,0,1,h||0,m||0); d.setMinutes(d.getMinutes()+30); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function apptsOn(date){ return DB.appointments.filter(a=>a.date===date).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
function apptColor(id){ let h=0; for(const c of String(id||"")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h},75%,88%)`; }
function apptChip(a){ const bg=apptColor(a.patientId); return `<button class="appt-chip" style="background:${bg};border-color:${bg};color:#0f172a" onclick="editAppt('${a.id}')" title="Edit appointment"><b>${esc(a.time||"")} - ${esc(add30(a.time)||"")} (${esc(fullName(patientById(a.patientId)))})</b>${esc(a.reason||"30 minute visit")}</button>`; }
function setCalView(v){ calView=v; if(v==="day") calDate=todayISO(); views.calendar(); }
function goToday(){ calDate=todayISO(); views.calendar(); }
function jumpCalDate(){ calDate=$("#cal_jump")?.value||calDate; views.calendar(); }
function moveCal(dir){
  const d=dparse(calDate);
  if(calView==="day") calDate=diso(dadd(d,dir));
  if(calView==="week") calDate=diso(dadd(d,dir*7));
  if(calView==="month"){ d.setMonth(d.getMonth()+dir); calDate=diso(d); }
  if(calView==="year"){ d.setFullYear(d.getFullYear()+dir); calDate=diso(d); }
  views.calendar();
}
function renderCalendar(){
  const box=$("#calendarView"), title=$("#calTitle"); if(!box||!title) return;
  const d=dparse(calDate), months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  if(calView==="day"){
    title.textContent = d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const slots = Array.from(new Set([...workSlots(), ...apptsOn(calDate).map(a=>normalizeTime30(a.time))])).filter(Boolean).sort();
    box.innerHTML = `<div class="time-grid" style="grid-template-columns:86px 1fr">
      <div class="time-head">Time</div><div class="time-head">${d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</div>
      ${slots.map(t=>{ const a=apptsOn(calDate).filter(x=>normalizeTime30(x.time)===t);
        return `<div class="time-label">${t}</div><div class="time-cell">${a.map(apptChip).join("")}</div>`; }).join("")}</div>`;
  } else if(calView==="week"){
    const start=startWeek(d), days=[0,1,2,3,4,5,6].map(i=>dadd(start,i));
    title.textContent = `${days[0].toLocaleDateString()} - ${days[6].toLocaleDateString()}`;
    const weekAppts = days.flatMap(x=>apptsOn(diso(x)).map(a=>normalizeTime30(a.time)));
    const slots = Array.from(new Set([...workSlots(), ...weekAppts])).filter(Boolean).sort();
    box.innerHTML = `<div class="time-grid" style="grid-template-columns:86px repeat(7,1fr)">
      <div class="time-head">Time</div>${days.map(x=>`<div class="time-head">${x.toLocaleDateString(undefined,{weekday:"short"})}<br>${x.getMonth()+1}/${x.getDate()}</div>`).join("")}
      ${slots.map(t=>`<div class="time-label">${t}</div>${days.map(x=>{ const a=apptsOn(diso(x)).filter(y=>normalizeTime30(y.time)===t);
        return `<div class="time-cell">${a.map(apptChip).join("")}</div>`; }).join("")}`).join("")}</div>`;
  } else if(calView==="month"){
    const first=new Date(d.getFullYear(),d.getMonth(),1), start=startWeek(first);
    const days=Array.from({length:42},(_,i)=>dadd(start,i));
    title.textContent = `${months[d.getMonth()]} ${d.getFullYear()}`;
    box.innerHTML = `<div class="calendar-grid" style="grid-template-columns:repeat(7,1fr)">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-day-head">${x}</div>`).join("")}${days.map(x=>`<div class="cal-cell ${x.getMonth()!==d.getMonth()?'cal-muted':''}" onclick="calDate='${diso(x)}';calView='day';views.calendar()"><div class="cal-date">${x.getDate()}</div>${apptsOn(diso(x)).slice(0,3).map(apptChip).join("")}${apptsOn(diso(x)).length>3?`<span class="hint">+${apptsOn(diso(x)).length-3} more</span>`:""}</div>`).join("")}</div>`;
  } else {
    title.textContent = `${d.getFullYear()}`;
    box.innerHTML = `<div class="year-grid">${months.map((m,i)=>{ const list=DB.appointments.filter(a=>{ const x=dparse(a.date); return x.getFullYear()===d.getFullYear() && x.getMonth()===i; }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
      return `<div class="month-card" onclick="calDate='${d.getFullYear()}-${String(i+1).padStart(2,"0")}-01';calView='month';views.calendar()"><h4>${m}</h4>${list.slice(0,4).map(a=>`<div class="appt-chip"><b>${esc(a.date)} ${esc(a.time||"")} - ${esc(add30(a.time)||"")}</b>${esc(fullName(patientById(a.patientId)))}</div>`).join("")||'<span class="muted">No bookings</span>'}${list.length>4?`<div class="hint">+${list.length-4} more</div>`:""}</div>`; }).join("")}</div>`;
  }
}

/* ============================ SETTINGS / BACKUP ============================ */
let settingsTab = "clinic";
function switchSettingsTab(tab){ settingsTab=tab; showSettingsTab(); }
function showSettingsTab(){
  document.querySelectorAll(".settings-section").forEach(s=>s.classList.toggle("on",s.dataset.settings===settingsTab));
  document.querySelectorAll(".pill-tabs button").forEach(b=>b.classList.toggle("on",b.textContent.toLowerCase().includes(settingsTab==="clinic"?"clinic":settingsTab==="services"?"billing":settingsTab)));
}
views.settings = function(){
  const c=DB.clinic;
  content.innerHTML=`<div class="pill-tabs">
    ${[["clinic","Clinic Info"],["services","Billing Codes"],["backup","Data Backup"],["export","Spreadsheet Export"]].map(t=>`<button class="${settingsTab===t[0]?'on':''}" onclick="switchSettingsTab('${t[0]}')">${t[1]}</button>`).join("")}
  </div>
  <div class="panel settings-section" data-settings="clinic"><h3>Clinic Details</h3>
    <div class="grid three">
      ${inp2("name","Clinic Name",c.name)}${inp2("provider","Provider",c.provider)}${inp2("phone","Phone",c.phone)}
      ${inp2("email","Email",c.email)}${inp2("currency","Currency Symbol",c.currency)}${inp2("taxRate","Default Tax %",c.taxRate)}
      <div class="field"><label>Work Day Starts</label><input id="c_workStart" type="time" step="1800" value="${esc(c.workStart||"08:00")}"/></div>
      <div class="field"><label>Work Day Ends</label><input id="c_workEnd" type="time" step="1800" value="${esc(c.workEnd||"18:00")}"/></div>
      <div class="field full">${inp2raw("address","Address",c.address)}</div>
    </div>
    <div class="sec-title">Branding</div>
    <div class="grid">
      <div class="field">
        <label>Clinic Logo</label>
        <div id="logoPreview">${clinicImgPreview("logo")}</div>
        <label class="btn sm" style="margin-top:6px">&#128247; Upload Logo<input type="file" accept="image/png,image/jpeg,image/svg+xml" style="display:none" onchange="uploadClinicImage('logo',this)"></label>
      </div>
      <div class="field">
        <label>Doctor's Signature</label>
        <div id="signaturePreview">${clinicImgPreview("signature")}</div>
        <label class="btn sm" style="margin-top:6px">&#9997; Upload Signature<input type="file" accept="image/png,image/jpeg,image/svg+xml" style="display:none" onchange="uploadClinicImage('signature',this)"></label>
      </div>
      <div class="field full">
        <label>Pain Diagram — Body Chart Image</label>
        <p class="hint" style="margin:2px 0 6px">Upload a clinical front/back body chart image (PNG/JPEG/SVG). It's used behind the clickable pain regions on the Intake form and SOAP notes, and travels with your backups and data file. If none is uploaded, the app looks for <code>body-chart.png</code> next to this file.</p>
        <div id="bodyChartPreview">${clinicImgPreview("bodyChart")}</div>
        <label class="btn sm" style="margin-top:6px">&#128101; Upload Body Chart<input type="file" accept="image/png,image/jpeg,image/svg+xml" style="display:none" onchange="uploadClinicImage('bodyChart',this)"></label>
      </div>
    </div>
    <div style="margin-top:12px"><button class="btn primary" onclick="saveClinic()">Save Clinic</button></div>
  </div>
  <div class="panel settings-section" data-settings="services"><h3>Services / Billing Codes</h3>
    <p class="desc">Create billing-code profiles for different fee schedules or service sets. Edit the table below, then save it to a profile.</p>
    <div class="row-actions" style="align-items:center;margin-bottom:12px">
      <label class="hint">Active Profile</label>
      <select id="svc_profile" class="btn" style="min-width:220px" onchange="loadServiceProfile(this.value)">${serviceProfiles().map(p=>`<option value="${p.id}" ${p.id===DB.clinic.activeServiceProfileId?'selected':''}>${esc(p.name)}</option>`).join("")}</select>
      <button class="btn sm" onclick="saveServicesAsProfile()">Save as New Profile</button>
      <button class="btn sm" onclick="updateServiceProfile()">Save Changes to Profile</button>
      <button class="btn sm" onclick="renameServiceProfile()">Rename Profile</button>
      <button class="btn sm danger" onclick="deleteServiceProfile()">Delete Profile</button>
      <button class="btn sm" onclick="restoreDefaultServices()">Restore Default Codes</button>
    </div>
    <table><thead><tr><th>Code</th><th>Description</th><th>Price</th><th></th></tr></thead><tbody id="svcRows"></tbody></table>
    <button class="btn sm" style="margin-top:8px" onclick="addSvc()">+ Add service</button>
  </div>
  <div class="panel settings-section" data-settings="backup"><h3>Portable Data File (recommended)</h3>
    <p class="desc">Link a <b>PostureClinicData.json</b> file so the app saves everything into a real file that travels with the app. Put it inside this app folder — then copying the folder to a USB drive or another PC moves all patients, notes and invoices with it.</p>

    <p class="hint" style="margin-top:12px">Tip: after linking on a new computer, choose <b>Open existing data file</b> and pick the <code>PostureClinicData.json</code> that came with the folder.</p>

      <button class="btn primary" onclick="exportData()">&#11015; Export Backup (.json)</button>
      <label class="btn">&#11014; Import Backup<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>

      <button class="btn accent" onclick="exportExcel()">&#128202; Export Excel (.xls)</button>
    </div>

    <div class="row-actions">
      <button class="btn" onclick="exportCSV('patients')">&#11015; Patients</button>
      <button class="btn" onclick="exportCSV('visits')">&#11015; SOAP Notes</button>

      <button class="btn" onclick="exportCSV('invoiceItems')">&#11015; Invoice Line Items</button>
      <button class="btn" onclick="exportCSV('invoicePayments')">&#11015; Invoice Payments</button>
      <button class="btn" onclick="exportCSV('appointments')">&#11015; Appointments</button>
      <button class="btn primary" onclick="exportAllCSV()">&#11015; Export All as CSV (multiple files)</button>
    </div>
    <div class="sec-title">Google Sheets</div>
    <div class="row-actions">
      <button class="btn" onclick="exportGoogleSheetsFile()">&#128279; Download for Google Sheets + Open Sheets</button>
    </div>
    <p class="hint" style="margin-top:10px">This offline app cannot write directly into your Google account. The button downloads a Google Sheets-compatible Excel file, then opens Google Sheets. In Sheets, use <b>File &gt; Import &gt; Upload</b> and choose the downloaded file.</p>
  </div>`;
  renderFsPanel();
  renderSvc();
  showSettingsTab();
};
function inp2(id,l,v){return `<div class="field"><label>${l}</label><input id="c_${id}" value="${esc(v??'')}"/></div>`;}
function inp2raw(id,l,v){return `<label>${l}</label><input id="c_${id}" value="${esc(v??'')}"/>`;}
function saveClinic(){ ["name","provider","phone","email","currency","address","workStart","workEnd"].forEach(k=>DB.clinic[k]=$("#c_"+k).value); DB.clinic.taxRate=Number($("#c_taxRate").value)||0; save(); toast("Clinic saved"); }
const imgKindLabel = kind => ({logo:"Logo",signature:"Signature",bodyChart:"Body chart"}[kind]||kind);
function clinicImgPreview(kind){
  const src=DB.clinic[kind];
  const label=imgKindLabel(kind).toLowerCase();
  const maxH=kind==="bodyChart"?120:70;
  return src
    ? `<img src="${esc(src)}" alt="${label}" style="max-height:${maxH}px;max-width:260px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff"/>
       <button class="btn sm danger" style="margin-left:8px;vertical-align:middle" onclick="removeClinicImage('${kind}')">Remove</button>`
    : `<span class="muted">No ${label} uploaded.</span>`;
}
function uploadClinicImage(kind,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ toast("Please choose an image file (PNG, JPEG, or SVG)"); inp.value=""; return; }
  const r=new FileReader();
  r.onload=()=>{ DB.clinic[kind]=r.result; save(); const el=$("#"+kind+"Preview"); if(el) el.innerHTML=clinicImgPreview(kind); toast(imgKindLabel(kind)+" saved"); };
  r.onerror=()=>toast("Could not read image");
  r.readAsDataURL(f);
}
function removeClinicImage(kind){
  delete DB.clinic[kind]; save(); const el=$("#"+kind+"Preview"); if(el) el.innerHTML=clinicImgPreview(kind);
  toast(imgKindLabel(kind)+" removed");
}
function cloneServices(s){ return JSON.parse(JSON.stringify(s||[])); }
function serviceProfiles(){
  DB.clinic.serviceProfiles = DB.clinic.serviceProfiles || [{id:"default",name:"Default Chiropractic",services:cloneServices(DEFAULT_SERVICES)}];
  DB.clinic.activeServiceProfileId = DB.clinic.activeServiceProfileId || DB.clinic.serviceProfiles[0].id;
  DB.clinic.services = DB.clinic.services || cloneServices(DB.clinic.serviceProfiles[0].services);
  return DB.clinic.serviceProfiles;
}
function loadServiceProfile(id){
  const p=serviceProfiles().find(x=>x.id===id); if(!p) return;
  DB.clinic.activeServiceProfileId=id; DB.clinic.services=cloneServices(p.services); save(); views.settings(); toast("Service profile loaded");
}
function saveServicesAsProfile(){
  const name=prompt("Name this billing-code profile:"); if(!name) return;
  const p={id:uid(),name:name.trim(),services:cloneServices(DB.clinic.services)};
  serviceProfiles().push(p); DB.clinic.activeServiceProfileId=p.id; save(); views.settings(); toast("Service profile saved");
}
function updateServiceProfile(){
  const p=serviceProfiles().find(x=>x.id===DB.clinic.activeServiceProfileId); if(!p) return;
  p.services=cloneServices(DB.clinic.services); save(); toast("Profile updated");
}
function renameServiceProfile(){
  const p=serviceProfiles().find(x=>x.id===DB.clinic.activeServiceProfileId); if(!p) return;
  const name=prompt("New profile name:",p.name); if(!name) return;
  p.name=name.trim(); save(); views.settings(); toast("Profile renamed");
}
function deleteServiceProfile(){
  const profiles=serviceProfiles(); if(profiles.length<=1){ toast("Keep at least one profile"); return; }
  const p=profiles.find(x=>x.id===DB.clinic.activeServiceProfileId); if(!p||!confirm(`Delete service profile "${p.name}"?`)) return;
  DB.clinic.serviceProfiles=profiles.filter(x=>x.id!==p.id);
  DB.clinic.activeServiceProfileId=DB.clinic.serviceProfiles[0].id;
  DB.clinic.services=cloneServices(DB.clinic.serviceProfiles[0].services);
  save(); views.settings(); toast("Profile deleted");
}
function restoreDefaultServices(){
  if(!confirm("Restore the default chiropractic billing codes? Current table changes will be replaced.")) return;
  DB.clinic.services=cloneServices(DEFAULT_SERVICES);
  let p=serviceProfiles().find(x=>x.id==="default");
  if(!p){ p={id:"default",name:"Default Chiropractic",services:cloneServices(DEFAULT_SERVICES)}; DB.clinic.serviceProfiles.unshift(p); }
  else p.services=cloneServices(DEFAULT_SERVICES);
  DB.clinic.activeServiceProfileId="default"; save(); views.settings(); toast("Default billing codes restored");
}
function renderSvc(){ const b=$("#svcRows"); if(!b)return; b.innerHTML=DB.clinic.services.map((s,i)=>`<tr>
  <td><input value="${esc(s.code)}" oninput="DB.clinic.services[${i}].code=this.value;save()"/></td>
  <td><input style="width:100%" value="${esc(s.desc)}" oninput="DB.clinic.services[${i}].desc=this.value;save()"/></td>
  <td><input type="number" style="width:90px" value="${s.price}" oninput="DB.clinic.services[${i}].price=Number(this.value);save()"/></td>
  <td><button class="btn sm danger" onclick="DB.clinic.services.splice(${i},1);save();renderSvc()">&times;</button></td></tr>`).join(""); }
function addSvc(){ DB.clinic.services.push({code:"",desc:"",price:0}); save(); renderSvc(); }
function renderFsPanel(){
  const s=$("#fsStatus"), b=$("#fsButtons"); if(!s||!b) return;
  if(!fsSupported()){
    s.innerHTML=`<span class="tag amber">Not available in this browser</span> <span class="muted">Use Microsoft Edge or Chrome to link a data file, or use manual backup below.</span>`;
    b.innerHTML=""; return;
  }
  if(needsReconnect){ s.innerHTML=`<span class="tag amber">Needs reconnect</span> <span class="muted">Click reconnect to re-grant access after restart.</span>`;
    b.innerHTML=`<button class="btn primary" onclick="reconnectDataFile()">Reconnect data file</button>`; return; }
  if(fileHandle){ s.innerHTML=`<span class="tag green">Linked</span> <b>${esc(fileHandle.name||"PostureClinicData.json")}</b> <span class="muted">— all changes save here automatically.</span>`;
    b.innerHTML=`<button class="btn" onclick="openDataFile()">Open a different data file</button>
      <button class="btn danger" onclick="disconnectDataFile()">Unlink</button>`; return; }
  s.innerHTML=`<span class="tag amber">Not linked</span> <span class="muted">Data is only in this browser on this PC.</span>`;
  b.innerHTML=`<button class="btn primary" onclick="connectDataFile()">Link new data file</button>
    <button class="btn" onclick="openDataFile()">Open existing data file</button>`;
}
function exportData(){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="posture-clinic-backup-"+todayISO()+".json"; a.click(); toast("Backup exported"); }
function importData(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ DB=JSON.parse(r.result); save(); toast("Backup imported"); go("dashboard"); }catch(e){ toast("Invalid file"); } }; r.readAsText(f); }
function wipe(){ if(!confirm("Erase ALL patients, notes, and invoices? This cannot be undone."))return; localStorage.removeItem(DB_KEY); DB=seed(); _dirty=true; scheduleFileWrite(); toast("All data erased"); go("dashboard"); }

/* ============================ SPREADSHEET EXPORT (Excel / CSV) ============================ */
/* Build table data as {name, headers:[...], rows:[[...],...]} — shared by CSV and Excel */
function painSummary(pain){ return Object.keys(pain||{}).map(k=>{ const p=pain[k]; return `${k}(${p.intensity ?? ""}${p.type?"/"+p.type:""})`; }).join("; "); }
function itemsSummary(items){ return (items||[]).map(it=>`${it.qty||0}x ${it.desc||it.code||""} @${(Number(it.price)||0).toFixed(2)}`.trim()).join("; "); }
function exportTable(name){
  const P=DB.patients, name2=id=>fullName(patientById(id));
  switch(name){
    case "patients": return { name:"Patients",
      headers:["ID","First","Last","DOB","Sex","Phone","Email","Occupation","Address","Insurance","Policy","Group","Emergency Name","Emergency Relationship","Emergency Phone","Chief Complaint","Pain Onset","Pain Type","Pain Level","Pain Frequency","Areas of Pain","Medical History","Medications","Allergies","Prior Treatment","Smoker","Exercise","Pregnant","Consent","Created"],
      rows:P.map(p=>[p.id,p.first,p.last,p.dob,p.sex,p.phone,p.email,p.occupation,p.address,p.insurance,p.policy,p.group,p.emergencyName,p.emergencyRel,p.emergencyPhone,p.chiefComplaint,p.painOnset,p.painType,p.painLevel,p.painFreq,painSummary(p.pain),p.medicalHistory,p.medications,p.allergies,p.priorTreatment,p.smoker,p.exercise,p.pregnant,p.consent?"Yes":"No",p.created]) };
    case "visits": return { name:"SOAP Notes",
      headers:["ID","Date","Patient","Patient ID","Services Provided","Areas of Pain","Subjective","Objective","Assessment","Plan"],
      rows:DB.visits.map(v=>[v.id,v.date,name2(v.patientId),v.patientId,soapServiceSummary(v),painSummary(v.pain),v.subjective,v.objective,v.assessment,v.plan]) };
    case "invoices": return { name:"Invoices",
      headers:["Invoice #","ID","Date","Patient","Patient ID","Status","Line Items","Discount","Tax Rate %","Total","Amount Paid","Outstanding Balance","Notes"],
      rows:DB.invoices.map(i=>{ const t=invTotals(i); return [i.number,i.id,i.date,name2(i.patientId),i.patientId,i.status,itemsSummary(i.items),Number(i.discount)||0,Number(i.taxRate)||0,t.total,t.paid,t.balance,i.notes]; }) };
    case "invoiceItems": { const rows=[];
      DB.invoices.forEach(i=>(i.items||[]).forEach(it=>{ const qty=Number(it.qty)||0, price=Number(it.price)||0;
        rows.push([i.number,i.date,name2(i.patientId),it.code,it.desc,qty,price,qty*price]); }));
      return { name:"Invoice Items", headers:["Invoice #","Date","Patient","Code","Description","Qty","Price","Amount"], rows }; }
    case "invoicePayments": { const rows=[];
      DB.invoices.forEach(i=>{
        if(Number(i.paidAmount)||0) rows.push([i.number,i.date,name2(i.patientId),"Previous",Number(i.paidAmount)||0,"Recorded before payment history"]);
        (i.payments||[]).forEach(p=>rows.push([i.number,p.date,name2(i.patientId),p.id,Number(p.amount)||0,p.note]));
      });
      return { name:"Invoice Payments", headers:["Invoice #","Payment Date","Patient","Payment ID","Amount","Note / Method"], rows }; }
    case "appointments": return { name:"Appointments",
      headers:["ID","Date","Time","Patient","Patient ID","Reason"],
      rows:DB.appointments.map(a=>[a.id,a.date,a.time,name2(a.patientId),a.patientId,a.reason]) };
  }
}

function downloadBlob(content, filename, mime){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvCell(v){ const s=(v==null?"":String(v)); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function tableToCSV(t){ return "\uFEFF" + [t.headers, ...t.rows].map(r=>r.map(csvCell).join(",")).join("\r\n"); }
function exportCSV(name){
  const t=exportTable(name); if(!t) return;
  const slug=name.replace(/([a-z])([A-Z])/g,"$1-$2").toLowerCase();
  downloadBlob(tableToCSV(t), `posture-clinic-${slug}-${todayISO()}.csv`, "text/csv;charset=utf-8");
  toast(`${t.name} CSV exported`);
}
function exportAllCSV(){
  ["patients","visits","invoices","invoiceItems","invoicePayments","appointments"].forEach((n,i)=>setTimeout(()=>exportCSV(n), i*300));
  toast("Exporting all tables as CSV…");
}

/* Excel via SpreadsheetML 2003 XML — opens in Excel & Google Sheets with multiple tabs, no libraries */
function xmlEsc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function xmlCell(v){
  if(typeof v==="number" && isFinite(v)) return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
}
function xmlSheet(t){
  const head=`<Row>${t.headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEsc(h)}</Data></Cell>`).join("")}</Row>`;
  const body=t.rows.map(r=>`<Row>${r.map(xmlCell).join("")}</Row>`).join("");
  return `<Worksheet ss:Name="${xmlEsc(t.name)}"><Table>${head}${body}</Table></Worksheet>`;
}
function exportExcel(){
  const tables=["patients","visits","invoices","invoiceItems","invoicePayments","appointments"].map(exportTable);
  const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/></Style></Styles>
${tables.map(xmlSheet).join("\n")}
</Workbook>`;
  downloadBlob(xml, `posture-clinic-export-${todayISO()}.xls`, "application/vnd.ms-excel");
  toast("Excel workbook exported");
}
function exportGoogleSheetsFile(){ exportExcel(); setTimeout(openGoogleSheets,600); toast("Downloaded Excel file. In Google Sheets use File > Import > Upload."); }
function openGoogleSheets(){ window.open("https://sheets.new","_blank"); toast("Then use File > Import to load your CSV/Excel file"); }

/* ============================ PATIENT PICKER (phone book) ============================ */
let _pickerTarget = null, _pickerLetter = "All", _pickerQuery = "";
const pickerFirstLetter = p => ((p.last||p.first||"").trim()[0]||"").toUpperCase();
const pickerSortKey = p => ((p.last||p.first||"")+" "+(p.first||"")).trim().toLowerCase();
function pickerDisplayName(p){
  const last=(p.last||"").trim(), first=(p.first||"").trim();
  if(last&&first) return esc(`${last}, ${first}`);
  return esc(last||first||"Unknown");
}
function openPatientPicker(targetSelectId){
  _pickerTarget = targetSelectId; _pickerLetter = "All"; _pickerQuery = "";
  openModal(`
    <div class="modal-head"><h3>&#128199; Select Patient</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <input id="pickerSearch" class="btn" style="width:100%;margin-bottom:10px" placeholder="Search name / phone / DOB / email…" oninput="pickerOnSearch(this.value)"/>
    <div id="pickerAlpha" class="pill-tabs" style="gap:4px"></div>
    <div id="pickerList" style="max-height:52vh;overflow:auto;margin-top:8px"></div>
    <div class="modal-foot no-print"><button class="btn" onclick="closeModal()">Cancel</button></div>
  `);
  renderPickerAlpha(); renderPickerList();
  const s = $("#pickerSearch"); if(s) s.focus();
}
function pickerOnSearch(v){ _pickerQuery = v; renderPickerList(); }
function pickerSetLetter(l){ _pickerLetter = l; renderPickerAlpha(); renderPickerList(); }
function renderPickerAlpha(){
  const box = $("#pickerAlpha"); if(!box) return;
  const present = {}; DB.patients.forEach(p=>{ const c=pickerFirstLetter(p); if(c) present[c]=true; });
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  box.innerHTML = `<button class="${_pickerLetter==='All'?'on':''}" onclick="pickerSetLetter('All')">All</button>` +
    letters.map(l=>`<button class="${_pickerLetter===l?'on':''}" ${present[l]?'':'disabled style="opacity:.35;cursor:default"'} onclick="pickerSetLetter('${l}')">${l}</button>`).join("");
}
function renderPickerList(){
  const box = $("#pickerList"); if(!box) return;
  const q = (_pickerQuery||"").toLowerCase().trim();
  let list = DB.patients.slice().sort((a,b)=>pickerSortKey(a).localeCompare(pickerSortKey(b)));
  if(_pickerLetter!=="All") list = list.filter(p=>pickerFirstLetter(p)===_pickerLetter);
  if(q) list = list.filter(p=>(fullName(p)+" "+(p.phone||"")+" "+(p.dob||"")+" "+(p.email||"")).toLowerCase().includes(q));
  box.innerHTML = list.length ? list.map(p=>`
    <div class="painitem" style="cursor:pointer" onclick="pickPatient('${p.id}')">
      <span class="nm">${pickerDisplayName(p)}</span>
      <span class="muted">${esc(p.phone||"no phone")}${p.dob?" · "+esc(p.dob):""}</span>
    </div>`).join("")
    : `<div class="empty">No matching patients.</div>`;
}
function pickPatient(id){
  const hadStack = !!modalStack.length;
  if(hadStack) modalBack();
  const sel = document.getElementById(_pickerTarget);
  if(sel){ sel.value = id; sel.dispatchEvent(new Event("change",{bubbles:true})); }
  if(!hadStack) closeModal();
}

/* ============================ PRINT ============================ */
function printModal(){ window.print(); }

/* ============================ INIT ============================ */
initStorage();
